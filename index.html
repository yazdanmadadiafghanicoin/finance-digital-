<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Digital Finance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #07111f;
      color: #fff;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      background: linear-gradient(180deg,#07111f,#0b1728);
      padding-bottom: 80px;
    }

    header {
      padding: 20px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1b2b40;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .brand span {
      color: #35d07f;
    }

    .status {
      font-size: 12px;
      color: #35d07f;
    }

    .balance-card {
      margin: 16px;
      padding: 20px;
      border-radius: 20px;
      background: linear-gradient(135deg,#102b45,#0d1d31);
      border: 1px solid #1d3b56;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .balance-title {
      color: #91a4b8;
      font-size: 13px;
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }

    .currency {
      color: #35d07f;
      font-size: 15px;
      margin-right: 5px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 16px 14px;
      overflow-x: auto;
    }

    .tab {
      border: 0;
      background: #122236;
      color: #9eb0c4;
      padding: 10px 16px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab.active {
      background: #35d07f;
      color: #04110a;
      font-weight: bold;
    }

    .search {
      margin: 0 16px 14px;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #243b53;
      background: #0e1c2d;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .search input:focus {
      border-color: #35d07f;
    }

    .section-title {
      padding: 0 16px 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .market-list {
      padding: 0 12px;
    }

    .coin {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 8px;
      margin-bottom: 7px;
      border-radius: 15px;
      background: #0d1b2b;
      border: 1px solid #162b41;
      cursor: pointer;
    }

    .coin:hover {
      border-color: #2c526f;
    }

    .coin-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #172b40;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #35d07f;
      flex-shrink: 0;
    }

    .coin-info {
      flex: 1;
      min-width: 0;
    }

    .coin-name {
      font-weight: bold;
      font-size: 14px;
    }

    .coin-symbol {
      color: #71869c;
      font-size: 11px;
      margin-top: 4px;
    }

    .coin-price {
      text-align: left;
      direction: ltr;
    }

    .price {
      font-weight: bold;
      font-size: 14px;
    }

    .change {
      font-size: 11px;
      margin-top: 4px;
    }

    .positive {
      color: #35d07f;
    }

    .negative {
      color: #ff5d6c;
    }

    .trade-box {
      margin: 16px;
      padding: 18px;
      background: #0d1b2b;
      border: 1px solid #1c344d;
      border-radius: 20px;
    }

    .selected {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .selected-symbol {
      font-size: 22px;
      font-weight: bold;
    }

    .selected-price {
      color: #35d07f;
      direction: ltr;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      color: #8195a9;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #081522;
      border: 1px solid #243b53;
      color: white;
      outline: none;
      font-size: 15px;
      direction: ltr;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buy,
    .sell {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .buy {
      background: #35d07f;
      color: #031008;
    }

    .sell {
      background: #ff5364;
      color: white;
    }

    .buy:disabled,
    .sell:disabled {
      opacity: .5;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      display: none;
      font-size: 13px;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(53,208,127,.12);
      color: #35d07f;
    }

    .message.error {
      background: rgba(255,83,100,.12);
      color: #ff6977;
    }

    .portfolio-item,
    .history-item {
      margin: 0 12px 8px;
      padding: 14px;
      border-radius: 14px;
      background: #0d1b2b;
      border: 1px solid #162b41;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty {
      margin: 20px 16px;
      padding: 25px;
      text-align: center;
      color: #71869c;
      background: #0d1b2b;
      border-radius: 15px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #8ca0b4;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 700px;
      margin: auto;
      height: 65px;
      background: rgba(7,17,31,.97);
      border-top: 1px solid #1b2b40;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: 0;
      color: #71869c;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-btn div {
      font-size: 21px;
      margin-bottom: 3px;
    }

    .nav-btn.active {
      color: #35d07f;
    }

    .hidden {
      display: none !important;
    }

    @media (min-width: 701px) {
      .bottom-nav {
        border-radius: 18px 18px 0 0;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">Digital <span>Finance</span></div>
    <div class="status" id="connectionStatus">● آنلاین</div>
  </header>

  <div class="balance-card">
    <div class="balance-title">موجودی کل</div>
    <div class="balance">
      <span id="usdtBalance">0.00</span>
      <span class="currency">USDT</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="markets">بازار</button>
    <button class="tab" data-tab="portfolio">دارایی‌های من</button>
    <button class="tab" data-tab="history">تاریخچه</button>
  </div>

  <!-- MARKETS -->

  <section id="marketsSection">

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="جستجوی ارز..."
        autocomplete="off">
    </div>

    <div class="section-title">بازارها</div>

    <div id="marketList" class="market-list">
      <div class="loading">در حال دریافت بازارها...</div>
    </div>

    <div id="tradeBox" class="trade-box hidden">

      <div class="selected">
        <div>
          <div class="selected-symbol" id="selectedSymbol">BTC</div>
          <div style="color:#8195a9;font-size:12px" id="selectedName">
            Bitcoin
          </div>
        </div>

        <div class="selected-price" id="selectedPrice">
          0 USDT
        </div>
      </div>

      <div class="input-group">
        <label>مقدار</label>
        <input
          id="quantityInput"
          type="number"
          min="0"
          step="any"
          placeholder="0.00">
      </div>

      <div class="input-group">
        <label>ارزش تقریبی USDT</label>
        <input
          id="totalInput"
          type="text"
          readonly
          placeholder="0.00">
      </div>

      <div class="buttons">
        <button class="buy" id="buyButton">خرید</button>
        <button class="sell" id="sellButton">فروش</button>
      </div>

      <div id="tradeMessage" class="message"></div>

    </div>

  </section>

  <!-- PORTFOLIO -->

  <section id="portfolioSection" class="hidden">

    <div class="section-title">دارایی‌های من</div>

    <div id="portfolioList">
      <div class="loading">در حال دریافت دارایی‌ها...</div>
    </div>

  </section>

  <!-- HISTORY -->

  <section id="historySection" class="hidden">

    <div class="section-title">تاریخچه معاملات</div>

    <div id="historyList">
      <div class="loading">در حال دریافت تاریخچه...</div>
    </div>

  </section>

</div>

<div class="bottom-nav">

  <button class="nav-btn active" data-tab="markets">
    <div>📊</div>
    بازار
  </button>

  <button class="nav-btn" data-tab="portfolio">
    <div>💼</div>
    دارایی
  </button>

  <button class="nav-btn" data-tab="history">
    <div>📜</div>
    تاریخچه
  </button>

</div>


<script>

  /*
   * =========================================================
   * DIGITAL FINANCE
   * API CONFIGURATION
   * =========================================================
   *
   * این آدرس را با دامنه واقعی Vercel خودت عوض کن.
   *
   * مثال:
   * https://digital-finance-xxxx.vercel.app
   *
   */

  https://finance-digital-eta.vercel.app/
  /*
   * Telegram Web App
   */

  let tg = null;

  if (window.Telegram && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;

    try {
      tg.ready();
      tg.expand();
    } catch (e) {}
  }

  /*
   * Telegram user
   */

  let telegramId = "123456789";

  try {

    if (
      tg &&
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user &&
      tg.initDataUnsafe.user.id
    ) {
      telegramId = String(tg.initDataUnsafe.user.id);
    }

  } catch (e) {
    console.log("Telegram user unavailable");
  }


  /*
   * STATE
   */

  let markets = [];
  let balances = [];
  let trades = [];

  let selectedAsset = null;


  /*
   * HELPERS
   */

  function formatNumber(value, decimals = 8) {

    const number = Number(value || 0);

    if (!Number.isFinite(number)) {
      return "0";
    }

    return number.toLocaleString("en-US", {
      maximumFractionDigits: decimals
    });
  }


  function apiUrl(path) {

    return API_BASE.replace(/\/$/, "") + path;

  }


  async function apiFetch(path, options = {}) {

    const response = await fetch(apiUrl(path), {

      ...options,

      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }

    });

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error("پاسخ نامعتبر از سرور دریافت شد");
    }

    if (!response.ok || data.success === false) {

      throw new Error(
        data.message ||
        data.error ||
        "خطا در ارتباط با سرور"
      );

    }

    return data;

  }


  /*
   * LOAD MARKETS
   */

  async function loadMarkets() {

    const list = document.getElementById("marketList");

    list.innerHTML =
      '<div class="loading">در حال دریافت بازارها...</div>';

    try {

      const data = await apiFetch(
        "/api?action=markets"
      );

      markets = Array.isArray(data.markets)
        ? data.markets
        : [];

      renderMarkets(markets);

      document.getElementById("connectionStatus").textContent =
        "● آنلاین";

    } catch (error) {

      console.error(error);

      list.innerHTML = `
        <div class="empty">
          دریافت بازارها ناموفق بود.<br>
          <small>${escapeHtml(error.message)}</small>
        </div>
      `;

      document.getElementById("connectionStatus").textContent =
        "● خطا";

    }

  }


  /*
   * RENDER MARKETS
   */

  function renderMarkets(items) {

    const list = document.getElementById("marketList");

    if (!items.length) {

      list.innerHTML =
        '<div class="empty">ارزی پیدا نشد.</div>';

      return;

    }

    list.innerHTML = items.map(asset => {

      const symbol = asset.symbol || "";
      const name = asset.name || symbol;

      const price = Number(asset.price || 0);

      const change = Number(
        asset.change_24h ??
        asset.change ??
        0
      );

      const changeClass =
        change >= 0
          ? "positive"
          : "negative";

      const changeText =
        change >= 0
          ? "+" + change
          : change;

      return `

        <div class="coin"
             onclick="selectAsset('${escapeAttr(symbol)}')">

          <div class="coin-icon">
            ${escapeHtml(symbol.substring(0,3))}
          </div>

          <div class="coin-info">

            <div class="coin-name">
              ${escapeHtml(name)}
            </div>

            <div class="coin-symbol">
              ${escapeHtml(symbol)}
            </div>

          </div>

          <div class="coin-price">

            <div class="price">
              ${formatNumber(price, 8)}
            </div>

            <div class="change ${changeClass}">
              ${changeText}%
            </div>

          </div>

        </div>

      `;

    }).join("");

  }


  /*
   * SELECT ASSET
   */

  window.selectAsset = function(symbol) {

    const asset = markets.find(
      item => String(item.symbol).toUpperCase() ===
              String(symbol).toUpperCase()
    );

    if (!asset) {
      return;
    }

    selectedAsset = asset;

    document.getElementById("tradeBox")
      .classList.remove("hidden");

    document.getElementById("selectedSymbol")
      .textContent = asset.symbol;

    document.getElementById("selectedName")
      .textContent = asset.name || asset.symbol;

    document.getElementById("selectedPrice")
      .textContent =
      formatNumber(asset.price, 8) + " USDT";

    document.getElementById("quantityInput")
      .value = "";

    document.getElementById("totalInput")
      .value = "";

    document.getElementById("tradeMessage")
      .className = "message";

    document.getElementById("tradeBox")
      .scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

  };


  /*
   * CALCULATE TOTAL
   */

  document.getElementById("quantityInput")
    .addEventListener("input", function() {

      if (!selectedAsset) {
        return;
      }

      const quantity = Number(this.value || 0);
      const price = Number(selectedAsset.price || 0);

      const total = quantity * price;

      document.getElementById("totalInput")
        .value = formatNumber(total, 8);

    });


  /*
   * SEARCH
   */

  document.getElementById("searchInput")
    .addEventListener("input", function() {

      const query =
        this.value.trim().toLowerCase();

      if (!query) {

        renderMarkets(markets);

        return;

      }

      const filtered = markets.filter(asset => {

        const symbol =
          String(asset.symbol || "")
            .toLowerCase();

        const name =
          String(asset.name || "")
            .toLowerCase();

        return (
          symbol.includes(query) ||
          name.includes(query)
        );

      });

      renderMarkets(filtered);

    });


  /*
   * BUY
   */

  document.getElementById("buyButton")
    .addEventListener("click", function() {

      executeTrade("buy");

    });


  /*
   * SELL
   */

  document.getElementById("sellButton")
    .addEventListener("click", function() {

      executeTrade("sell");

    });


  /*
   * EXECUTE TRADE
   */

  async function executeTrade(type) {

    if (!selectedAsset) {

      showMessage(
        "اول یک ارز را انتخاب کن.",
        "error"
      );

      return;

    }

    const quantity =
      Number(
        document.getElementById("quantityInput").value
      );

    if (!quantity || quantity <= 0) {

      showMessage(
        "مقدار معتبر وارد کن.",
        "error"
      );

      return;

    }

    const buyButton =
      document.getElementById("buyButton");

    const sellButton =
      document.getElementById("sellButton");

    buyButton.disabled = true;
    sellButton.disabled = true;

    showMessage(
      "در حال ثبت معامله...",
      "success"
    );

    try {

      const data = await apiFetch(
        "/api?action=" + type,
        {
          method: "POST",

          body: JSON.stringify({

            telegram_id: telegramId,

            symbol: selectedAsset.symbol,

            quantity: quantity

          })

        }
      );

      showMessage(
        data.message ||
        "معامله با موفقیت ثبت شد.",
        "success"
      );

      document.getElementById("quantityInput")
        .value = "";

      document.getElementById("totalInput")
        .value = "";

      await loadBalances();

      await loadTrades();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "معامله انجام نشد.",
        "error"
      );

    }

    buyButton.disabled = false;
    sellButton.disabled = false;

  }


  /*
   * MESSAGE
   */

  function showMessage(message, type) {

    const box =
      document.getElementById("tradeMessage");

    box.textContent = message;

    box.className =
      "message show " + type;

  }


  /*
   * LOAD BALANCES
   */

  async function loadBalances() {

    try {

      const data = await apiFetch(
        "/api?action=balances&telegram_id=" +
        encodeURIComponent(telegramId)
      );

      balances = Array.isArray(data.balances)
        ? data.balances
        : [];

      renderBalances();

    } catch (error) {

      console.error(
        "Balance error:",
        error
      );

    }

  }


  /*
   * RENDER BALANCES
   */

  function renderBalances() {

    let usdt = 0;

    balances.forEach(balance => {

      if (
        String(balance.symbol || "")
          .toUpperCase() === "USDT"
      ) {

        usdt = Number(balance.amount || 0);

      }

    });

    document.getElementById("usdtBalance")
      .textContent =
      formatNumber(usdt, 2);


    const container =
      document.getElementById("portfolioList");

    const assets = balances.filter(balance => {

      const amount =
        Number(balance.amount || 0);

      return (
        String(balance.symbol || "")
          .toUpperCase() !== "USDT" &&
        amount > 0
      );

    });


    if (!assets.length) {

      container.innerHTML = `
        <div class="empty">
          هنوز دارایی‌ای خریداری نکرده‌ای.
          <br><br>
          از بخش بازار یک ارز انتخاب کن.
        </div>
      `;

      return;

    }


    container.innerHTML =
      assets.map(balance => {

        return `

          <div class="portfolio-item">

            <div>

              <strong>
                ${escapeHtml(balance.symbol)}
              </strong>

              <div style="color:#71869c;font-size:11px;margin-top:5px">
                ${escapeHtml(
                  balance.name ||
                  balance.symbol
                )}
              </div>

            </div>

            <div style="direction:ltr">
              ${formatNumber(balance.amount, 8)}
            </div>

          </div>

        `;

      }).join("");

  }


  /*
   * LOAD TRADES
   */

  async function loadTrades() {

    try {

      const data = await apiFetch(
        "/api?action=trades&telegram_id=" +
        encodeURIComponent(telegramId)
      );

      trades = Array.isArray(data.trades)
        ? data.trades
        : [];

      renderTrades();

    } catch (error) {

      console.error(
        "Trades error:",
        error
      );

    }

  }


  /*
   * RENDER TRADES
   */

  function renderTrades() {

    const container =
      document.getElementById("historyList");

    if (!trades.length) {

      container.innerHTML = `
        <div class="empty">
          هنوز معامله‌ای ثبت نشده است.
        </div>
      `;

      return;

    }


    container.innerHTML =
      trades.map(trade => {

        const side =
          String(
            trade.side ||
            trade.type ||
            ""
          ).toLowerCase();

        const isBuy =
          side === "buy";

        const sideText =
          isBuy ? "خرید" : "فروش";

        const sideClass =
          isBuy ? "positive" : "negative";

        return `

          <div class="history-item">

            <div>

              <strong>
                ${escapeHtml(
                  trade.symbol || ""
                )}
              </strong>

              <div style="margin-top:5px;font-size:11px"
                   class="${sideClass}">
                ${sideText}
              </div>

            </div>

            <div style="text-align:left;direction:ltr">

              <div>
                ${formatNumber(
                  trade.quantity || 0,
                  8
                )}
              </div>

              <div style="color:#71869c;font-size:11px;margin-top:4px">
                ${formatNumber(
                  trade.price || 0,
                  8
                )} USDT
              </div>

            </div>

          </div>

        `;

      }).join("");

  }


  /*
   * TABS
   */

  document.querySelectorAll(
    ".tab, .nav-btn"
  ).forEach(button => {

    button.addEventListener(
      "click",
      function() {

        const tab =
          this.dataset.tab;

        switchTab(tab);

      }
    );

  });


  function switchTab(tab) {

    document.querySelectorAll(
      ".tab, .nav-btn"
    ).forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.tab === tab
      );

    });


    document.getElementById(
      "marketsSection"
    ).classList.toggle(
      "hidden",
      tab !== "markets"
    );

    document.getElementById(
      "portfolioSection"
    ).classList.toggle(
      "hidden",
      tab !== "portfolio"
    );

    document.getElementById(
      "historySection"
    ).classList.toggle(
      "hidden",
      tab !== "history"
    );


    if (tab === "portfolio") {
      loadBalances();
    }

    if (tab === "history") {
      loadTrades();
    }

  }


  /*
   * SECURITY HELPERS
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttr(value) {

    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  /*
   * INITIALIZE
   */

  async function initialize() {

    await loadMarkets();

    await loadBalances();

    await loadTrades();

  }


  initialize();

</script>
