<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Digital Finance</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#070b10;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,11,16,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #202832;
  padding:14px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  color:#f0b90b;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  color:#9ba7b5;
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#f0b90b;
}

.dot.ok{
  background:#20c997;
}

.dot.error{
  background:#ef4444;
}

/* BALANCE */

.balance{
  margin:14px;
  padding:18px;
  border:1px solid #252e38;
  border-radius:18px;
  background:linear-gradient(145deg,#111821,#0b1016);
}

.balance-title{
  color:#8c98a7;
  font-size:13px;
}

.balance-value{
  margin-top:7px;
  font-size:30px;
  font-weight:800;
}

.balance-sub{
  color:#8995a3;
  font-size:12px;
  margin-top:5px;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:14px;
}

.action{
  border:0;
  border-radius:13px;
  padding:14px;
  font-weight:800;
}

.action.buy{
  background:#20c997;
  color:#04120d;
}

.action.sell{
  background:#ef4444;
  color:#fff;
}

/* SEARCH */

.search-box{
  margin:14px;
  position:relative;
}

.search{
  width:100%;
  background:#10161e;
  border:1px solid #27313c;
  color:#fff;
  border-radius:12px;
  padding:13px 15px;
  outline:none;
}

.search:focus{
  border-color:#f0b90b;
}

/* FILTERS */

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 14px 12px;
}

.filters button{
  white-space:nowrap;
  border:1px solid #29333e;
  background:#10161e;
  color:#aeb8c4;
  border-radius:20px;
  padding:8px 14px;
}

.filters button.active{
  background:#f0b90b;
  border-color:#f0b90b;
  color:#111;
  font-weight:800;
}

/* MARKET */

.market-card{
  margin:14px;
  border:1px solid #222b35;
  border-radius:16px;
  overflow:hidden;
  background:#0c1218;
}

.market-head{
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #202832;
}

.market-count{
  font-size:13px;
  color:#8e9aa8;
}

.market-list{
  width:100%;
}

.market{
  display:grid;
  grid-template-columns:1.7fr 1.2fr .8fr;
  align-items:center;
  gap:8px;
  padding:14px;
  border-bottom:1px solid #1b232c;
}

.market:last-child{
  border-bottom:0;
}

.coin-name{
  min-width:0;
}

.symbol{
  font-weight:800;
  font-size:15px;
}

.name{
  color:#7f8b99;
  font-size:11px;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.price{
  text-align:left;
  font-weight:700;
  direction:ltr;
}

.change{
  text-align:left;
  font-size:12px;
  direction:ltr;
}

.positive{
  color:#20c997;
}

.negative{
  color:#ef4444;
}

.trade-btn{
  margin-top:6px;
  border:1px solid #39434e;
  background:#161e27;
  color:#fff;
  border-radius:8px;
  padding:7px 10px;
  font-size:11px;
}

.trade-btn:hover{
  border-color:#f0b90b;
}

.gold{
  color:#f0b90b;
}

/* LOADING */

.loading{
  padding:40px 20px;
  text-align:center;
  color:#9aa6b3;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #29333e;
  border-top-color:#f0b90b;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error-box{
  margin:14px;
  padding:16px;
  border-radius:12px;
  background:#241217;
  border:1px solid #6b2632;
  color:#ff9aa8;
  display:none;
}

.retry{
  margin-top:10px;
  border:0;
  background:#f0b90b;
  color:#111;
  border-radius:8px;
  padding:9px 15px;
  font-weight:800;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  max-width:1100px;
  margin:auto;
  background:#0c1117;
  border-top:1px solid #252e38;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}

.bottom button{
  border:0;
  background:none;
  color:#7e8996;
  padding:7px 2px;
  font-size:11px;
}

.bottom button.active{
  color:#f0b90b;
}

.bottom-icon{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.75);
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;
  background:#10161e;
  border:1px solid #29333e;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:19px;
  font-weight:800;
  margin-bottom:18px;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#202832;
  color:#fff;
}

.form-label{
  color:#8f9ba8;
  font-size:12px;
  margin:14px 0 6px;
}

.form-input{
  width:100%;
  border:1px solid #2b3540;
  background:#080d12;
  color:#fff;
  border-radius:10px;
  padding:13px;
  outline:none;
}

.form-input:focus{
  border-color:#f0b90b;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.modal-actions button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-weight:800;
}

.modal-buy{
  background:#20c997;
}

.modal-sell{
  background:#ef4444;
  color:#fff;
}

.info{
  padding:12px;
  border-radius:10px;
  background:#0a1016;
  border:1px solid #222b35;
  margin-top:10px;
  color:#aab4bf;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#7e8996;
}

/* DESKTOP */

@media(min-width:700px){
  .modal{
    align-items:center;
  }

  .modal-box{
    border-radius:20px;
  }

  .bottom{
    border:1px solid #252e38;
    border-radius:18px 18px 0 0;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-row">
      <div class="logo">
        Digital <span>Finance</span>
      </div>

      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
  </header>

  <section class="balance">
    <div class="balance-title">Total Wallet Balance</div>
    <div class="balance-value">
      <span id="walletBalance">10,000.00</span> USDT
    </div>
    <div class="balance-sub">
      Demo account • Starting balance
    </div>
  </section>

  <div class="actions">
    <button class="action buy" onclick="openTrade('buy')">
      خرید
    </button>

    <button class="action sell" onclick="openTrade('sell')">
      فروش
    </button>
  </div>

  <div class="search-box">
    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="جستجوی ارز، طلا یا نماد..."
      autocomplete="off">
  </div>

  <div class="filters">
    <button class="active" data-filter="all">همه</button>
    <button data-filter="crypto">Crypto</button>

    <button data-filter="usdc">USDC</button>

  <div id="errorBox" class="error-box">

  </div>

  <section class="market-card">

    <div class="market-head">
      <strong>Markets</strong>

      <div class="loading">

    </div>

</div>

<nav class="bottom">

  <button class="active" onclick="showHome(this)">
    <span class="bottom-icon">🏠</span>
    بازار
  </button>

  <button onclick="openWallet()">
    <span class="bottom-icon">💰</span>
    Wallet
  </button>

  <button onclick="openPortfolio()">
    <span class="bottom-icon">📊</span>
    Portfolio
  </button>

  <button onclick="openHistory()">
    <span class="bottom-icon">🧾</span>
    History
  </button>

</nav>


<!-- TRADE MODAL -->

<div id="tradeModal" class="modal">

  <div class="modal-box">

    <div class="modal-title">

      <span id="tradeTitle">Buy</span>

      <button class="close" onclick="closeModal('tradeModal')">
        ×

    </div>

    <div class="form-label">
      Market
    </div>

    <select id="tradeMarket" class="form-input">
    </select>

    <div class="form-label">

    </div>

    <input
      id="tradeAmount"

      min="0"

      <button
        id="buyButton"
        class="modal-buy"

</div>


<!-- WALLET MODAL -->

<div id="walletModal" class="modal">

  <div class="modal-box">

    <div class="modal-title">
      <span>Wallet</span>

      <button class="close" onclick="closeModal('walletModal')">
        ×
      </button>
    </div>

    <div class="info">
      موجودی USDT
      <br>
      <strong id="walletModalBalance">10,000.00 USDT</strong>
    </div>

    <div class="info">
      حساب Demo برای آزمایش Digital Finance
    </div>

    <div class="modal-actions">

      <button
        class="modal-buy"
        onclick="alert('Deposit در نسخه بعدی فعال می‌شود')">

<!-- PORTFOLIO MODAL -->

  <div class="modal-box">

    <div class="modal-title">

      <span>Portfolio</span>

      <button class="close" onclick="closeModal('portfolioModal')">
        ×
      </button>

    </div>

  </div>

</div>


<!-- HISTORY MODAL -->

<div id="historyModal" class="modal">

  <div class="modal-box">

    <div class="modal-title">

      <span>History</span>

      <button class="close" onclick="closeModal('historyModal')">
        ×
      </button>

    </div>

    <div id="historyContent"></div>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_BASE = window.location.origin;

const STARTING_USDT = 10000;

let markets = [];
let filteredMarkets = [];

let currentFilter = "all";
let currentTradeSide = "buy";

let walletBalance = STARTING_USDT;

let portfolio = {};

let history = [];


/* =========================================================
   STORAGE
========================================================= */

function getStorageKey(){
  try{
    if(
      window.Telegram &&
      Telegram.WebApp &&
      Telegram.WebApp.initDataUnsafe &&
      Telegram.WebApp.initDataUnsafe.user
    ){
      return "df_wallet_" + Telegram.WebApp.initDataUnsafe.user.id;
    }
  }catch(e){}

  return "df_wallet_demo";
}


function loadLocalData(){

  try{

    const key = getStorageKey();

    const saved = localStorage.getItem(key);

    if(saved){

      const data = JSON.parse(saved);

      if(typeof data.walletBalance === "number"){
        walletBalance = data.walletBalance;
      }

      if(data.portfolio && typeof data.portfolio === "object"){
        portfolio = data.portfolio;
      }

      if(Array.isArray(data.history)){
        history = data.history;
      }

    }

  }catch(error){

    console.warn("Storage error:",error);

  }

  updateWalletUI();
}


function saveLocalData(){

  try{

    const key = getStorageKey();

    localStorage.setItem(
      key,
      JSON.stringify({
        walletBalance,
        portfolio,
        history
      })
    );

  }catch(error){

    console.warn("Save error:",error);

  }

}


/* =========================================================
   TELEGRAM
========================================================= */

function initTelegram(){

  try{

    if(
      window.Telegram &&
      Telegram.WebApp
    ){

      Telegram.WebApp.ready();
      Telegram.WebApp.expand();

    }

  }catch(error){

    console.log("Telegram unavailable");

  }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(type,text){

  const dot = document.getElementById("statusDot");
  const label = document.getElementById("statusText");

  if(!dot || !label) return;

  dot.className = "dot";

  if(type === "ok"){
    dot.classList.add("ok");
  }

  if(type === "error"){
    dot.classList.add("error");
  }

  label.textContent = text;

}


/* =========================================================
   LOAD MARKETS
========================================================= */

async function loadMarkets(){

  setStatus("","Connecting...");

  hideError();

  const list = document.getElementById("marketList");

  if(list){

    list.innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <div>در حال دریافت بازارها...</div>
      </div>
    `;

  }

  try{

    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      12000
    );

    const response = await fetch(
      API_BASE + "/api/markets?time=" + Date.now(),
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        },
        cache:"no-store",
        signal:controller.signal
      }
    );

    clearTimeout(timeout);

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data = await response.json();

    if(!data){

      throw new Error("پاسخ خالی از سرور");

    }

    if(data.success !== true){

      throw new Error(
        data.error || "سرور خطا داد"
      );

    }

    if(!Array.isArray(data.markets)){

      throw new Error(
        "لیست markets در پاسخ وجود ندارد"
      );

    }

    markets = data.markets.map((item,index)=>{

      let price = Number(item.price);

      if(!Number.isFinite(price)){
        price = 0;
      }

      /*
        اگر GOLD24 باشد و قیمت معتبر نبود،
        قیمت مورد نظر 6850 قرار می‌گیرد.
      */

      if(
        String(item.symbol || "").toUpperCase() === "GOLD24" &&
        (!price || price <= 0)
      ){
        price = 6850;
      }

      return {

        id:item.id ?? index + 1,

        symbol:String(
          item.symbol || ""
        ).toUpperCase(),

        name:String(
          item.name || item.symbol || "Unknown"
        ),

        price:price,

        active:item.active !== false

      };

    });

    if(markets.length === 0){

      throw new Error(
        "هیچ بازاری پیدا نشد"
      );

    }

    setStatus(
      "ok",
      "Connected"
    );

    renderMarkets();

    populateTradeMarkets();

  }catch(error){

    console.error(
      "Markets error:",
      error
    );

    setStatus(
      "error",
      "Connection Error"
    );

    showError(
      error.name === "AbortError"
        ? "اتصال به سرور بیشتر از ۱۲ ثانیه طول کشید."
        : error.message
    );

    if(list){

      list.innerHTML = `
        <div class="empty">
          بازارها بارگذاری نشدند.
          <br><br>
          دکمه «تلاش دوباره» را بزنید.
        </div>
      `;

    }

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  const box = document.getElementById("errorBox");
  const text = document.getElementById("errorText");

  if(box){
    box.style.display = "block";
  }

  if(text){
    text.textContent =
      "خطا: " + message;
  }

}


function hideError(){

  const box = document.getElementById("errorBox");

  if(box){
    box.style.display = "none";
  }

}


/* =========================================================
   FILTER
========================================================= */

function marketMatchesFilter(market){

  const symbol =
    market.symbol.toUpperCase();

  if(currentFilter === "all"){
    return true;
  }

  if(currentFilter === "gold"){
    return (
      symbol.includes("GOLD") ||
      symbol === "XAU" ||
      market.name.toLowerCase().includes("gold")
    );
  }

  if(currentFilter === "usdt"){
    return symbol.includes("USDT");
  }

  if(currentFilter === "usdc"){
    return symbol.includes("USDC");
  }

  if(currentFilter === "crypto"){

    return !(
      symbol.includes("GOLD") ||
      symbol === "XAU"
    );

  }

  return true;

}


/* =========================================================
   RENDER MARKETS
========================================================= */

function renderMarkets(){

  const search =
    (
      document.getElementById("searchInput")?.value || ""
    ).trim().toLowerCase();

  filteredMarkets =
    markets.filter(market=>{

      const searchMatch =
        !search ||
        market.symbol.toLowerCase().includes(search) ||
        market.name.toLowerCase().includes(search);

      return (
        searchMatch &&
        marketMatchesFilter(market)
      );

    });

  const count =
    document.getElementById("marketCount");

  if(count){

    count.textContent =
      filteredMarkets.length +
      " / " +
      markets.length +
      " assets";

  }

  const list =
    document.getElementById("marketList");

  if(!list) return;

  if(filteredMarkets.length === 0){

    list.innerHTML = `
      <div class="empty">
        نتیجه‌ای پیدا نشد.
      </div>
    `;

    return;

  }

  list.innerHTML =
    filteredMarkets.map(market=>{

      const symbol =
        market.symbol;

      const isGold =
        symbol === "GOLD24" ||
        symbol.includes("GOLD");

      const price =
        formatPrice(market.price);

      return `

        <div class="market">

          <div class="coin-name">

            <div class="symbol ${isGold ? "gold" : ""}">
              ${escapeHtml(symbol)}
            </div>

            <div class="name">
              ${escapeHtml(market.name)}
            </div>

          </div>

          <div>

            <div class="price">
              ${price}
            </div>

            <div class="change positive">
              +0.00%
            </div>

          </div>

          <div style="text-align:left">

            <button
              class="trade-btn"
              onclick="openTradeForMarket(${Number(market.id)})">
              Trade
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   PRICE FORMAT
========================================================= */

function formatPrice(value){

  const number =
    Number(value);

  if(!Number.isFinite(number)){
    return "0.00";
  }

  if(number >= 1000){

    return number.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

  }

  if(number >= 1){

    return number.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:6
      }
    );

  }

  return number.toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:10
    }
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   TRADE MARKETS
========================================================= */

function populateTradeMarkets(){

  const select =
    document.getElementById("tradeMarket");

  if(!select) return;

  select.innerHTML =
    markets.map(market=>{

      return `
        <option value="${Number(market.id)}">
          ${escapeHtml(market.symbol)}
          — ${formatPrice(market.price)}
        </option>
      `;

    }).join("");

}


function openTrade(side="buy"){

  currentTradeSide = side;

  const modal =
    document.getElementById("tradeModal");

  const title =
    document.getElementById("tradeTitle");

  const buyButton =
    document.getElementById("buyButton");

  const sellButton =
    document.getElementById("sellButton");

  if(title){

    title.textContent =
      side === "buy"
        ? "Buy"
        : "Sell";

  }

  if(buyButton){
    buyButton.style.display =
      side === "buy"
        ? "block"
        : "none";
  }

  if(sellButton){
    sellButton.style.display =
      side === "sell"
        ? "block"
        : "none";
  }

  if(modal){
    modal.classList.add("show");
  }

  updateTradeInfo();

}


function openTradeForMarket(id){

  const select =
    document.getElementById("tradeMarket");

  if(select){
    select.value = String(id);
  }

  openTrade("buy");

}


function updateTradeInfo(){

  const select =
    document.getElementById("tradeMarket");

  const amountInput =
    document.getElementById("tradeAmount");

  const info =
    document.getElementById("tradeInfo");

  if(!select || !info) return;

  const market =
    markets.find(
      m => String(m.id) === String(select.value)
    );

  if(!market){

    info.textContent =
      "بازار انتخاب نشده است.";

    return;

  }

  const amount =
    Number(amountInput?.value || 0);

  const quantity =
    market.price > 0
      ? amount / market.price
      : 0;

  info.innerHTML =
    `
      ${escapeHtml(market.symbol)}
      قیمت:
      <strong>${formatPrice(market.price)}</strong>
      <br>
      مقدار دریافتی:
      <strong>${quantity.toFixed(8)}</strong>
    `;

}


/* =========================================================
   EXECUTE TRADE
========================================================= */

function executeTrade(side){

  const select =
    document.getElementById("tradeMarket");

  const amountInput =
    document.getElementById("tradeAmount");

  if(!select || !amountInput) return;

  const market =
    markets.find(
      m => String(m.id) === String(select.value)
    );

  if(!market){

    alert("بازار انتخاب نشده است.");

    return;

  }

  const amount =
    Number(amountInput.value);

  if(!Number.isFinite(amount) || amount <= 0){

    alert("مقدار معتبر وارد کنید.");

    return;

  }

  if(side === "buy"){

    if(amount > walletBalance){

      alert(
        "موجودی کافی نیست.\nموجودی شما: " +
        formatPrice(walletBalance) +
        " USDT"
      );

      return;

    }

  }

  const quantity =
    market.price > 0
      ? amount / market.price
      : 0;

  if(quantity <= 0){

    alert("قیمت این بازار معتبر نیست.");

    return;

  }

  const symbol =
    market.symbol;

  if(!portfolio[symbol]){

    portfolio[symbol] = {
      symbol:symbol,
      name:market.name,
      quantity:0,
      invested:0
    };

  }

  if(side === "buy"){

    walletBalance -= amount;

    portfolio[symbol].quantity += quantity;

    portfolio[symbol].invested += amount;

  }else{

    if(
      portfolio[symbol].quantity <
      quantity
    ){

      alert(
        "مقدار " +
        symbol +
        " برای فروش کافی نیست."
      );

      return;

    }

    walletBalance += amount;

    portfolio[symbol].quantity -= quantity;

    portfolio[symbol].invested -= amount;

    if(
      portfolio[symbol].quantity <= 0.00000001
    ){

      delete portfolio[symbol];

    }

  }

  history.unshift({

    side:side,

    symbol:symbol,

    quantity:quantity,

    amount:amount,

    price:market.price,

    time:new Date().toISOString()

  });

  history =
    history.slice(0,100);

  saveLocalData();

  updateWalletUI();

  closeModal("tradeModal");

  amountInput.value = "";

  alert(
    side === "buy"
      ? "خرید با موفقیت ثبت شد."
      : "فروش با موفقیت ثبت شد."
  );

}


/* =========================================================
   WALLET
========================================================= */

function updateWalletUI(){

  const value =
    formatPrice(walletBalance);

  const balance =
    document.getElementById("walletBalance");

  const modalBalance =
    document.getElementById("walletModalBalance");

  if(balance){
    balance.textContent = value;
  }

  if(modalBalance){
    modalBalance.textContent =
      value + " USDT";
  }

}


function openWallet(){

  updateWalletUI();

  document
    .getElementById("walletModal")
    ?.classList.add("show");

}


/* =========================================================
   PORTFOLIO
========================================================= */

function openPortfolio(){

  const content =
    document.getElementById("portfolioContent");

  if(!content) return;

  const items =
    Object.values(portfolio)
      .filter(item=>item.quantity > 0);

  if(items.length === 0){

    content.innerHTML = `
      <div class="empty">
        هنوز هیچ ارزی در Portfolio ندارید.
      </div>
    `;

  }else{

    content.innerHTML =
      items.map(item=>{

        return `
          <div class="info">

            <strong>
              ${escapeHtml(item.symbol)}
            </strong>

            <br><br>

            مقدار:
            ${item.quantity.toFixed(8)}

            <br>

            سرمایه:
            ${formatPrice(item.invested)}
            USDT

          </div>
        `;

      }).join("");

  }

  document
    .getElementById("portfolioModal")
    ?.classList.add("show");

}


/* =========================================================
   HISTORY
========================================================= */

function openHistory(){

  const content =
    document.getElementById("historyContent");

  if(!content) return;

  if(history.length === 0){

    content.innerHTML = `
      <div class="empty">
        هنوز معامله‌ای ثبت نشده است.
      </div>
    `;

  }else{

    content.innerHTML =
      history.map(item=>{

        const date =
          new Date(item.time)
            .toLocaleString();

        return `

          <div class="info">

            <strong class="${
              item.side === "buy"
                ? "positive"
                : "negative"
            }">

              ${
                item.side === "buy"
                  ? "BUY"
                  : "SELL"
              }

              ${escapeHtml(item.symbol)}

            </strong>

            <br><br>

            مقدار:
            ${item.quantity.toFixed(8)}

            <br>

            مبلغ:
            ${formatPrice(item.amount)}
            USDT

            <br>

            قیمت:
            ${formatPrice(item.price)}

            <br>

            <small>
              ${escapeHtml(date)}
            </small>

          </div>

        `;

      }).join("");

  }

  document
    .getElementById("historyModal")
    ?.classList.add("show");

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(id){

  document
    .getElementById(id)
    ?.classList.remove("show");

}


document
  .querySelectorAll(".modal")
  .forEach(modal=>{

    modal.addEventListener(
      "click",
      function(event){

        if(event.target === modal){

          modal.classList.remove("show");

        }

      }
    );

  });


/* =========================================================
   HOME
========================================================= */

function showHome(button){

  document
    .querySelectorAll(".bottom button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  if(button){
    button.classList.add("active");
  }

}


/* =========================================================
   FILTER EVENTS
========================================================= */

document
  .querySelectorAll(".filters button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      function(){

        document
          .querySelectorAll(".filters button")
          .forEach(btn=>{
            btn.classList.remove("active");
          });

        this.classList.add("active");

        currentFilter =
          this.dataset.filter || "all";

        renderMarkets();

      }
    );

  });


/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById("searchInput")
  ?.addEventListener(
    "input",
    renderMarkets
  );


/* =========================================================
   TRADE INPUT
========================================================= */

document
  .getElementById("tradeMarket")
  ?.addEventListener(
    "change",
    updateTradeInfo
  );


document
  .getElementById("tradeAmount")
  ?.addEventListener(
    "input",
    updateTradeInfo
  );


/* =========================================================
   GLOBAL JS ERROR
========================================================= */

window.addEventListener(
  "error",
  function(event){

    console.error(
      "JavaScript error:",
      event.error || event.message
    );

    /*
      اگر یک خطای JS اتفاق افتاد،
      صفحه برای همیشه Connecting نمی‌ماند.
    */

    if(markets.length === 0){

      setStatus(
        "error",
        "Page Error"
      );

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize(){

  try{

    initTelegram();

    loadLocalData();

    await loadMarkets();

  }catch(error){

    console.error(
      "Initialization error:",
      error
    );

    setStatus(
      "error",
      "Error"
    );

    showError(
      error.message || "خطای ناشناخته"
    );

  }

}


/* =========================================================
   START
========================================================= */

if(
  document.readyState === "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    initialize
  );

}else{

  initialize();

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  function(){

    if(document.visibilityState === "visible"){

      loadMarkets();

    }

  },
  30000
);

</script>
