<!DOCTYPE html>

<style>

*{
  box-sizing:border-box;
}

body{

  font-family:Arial,sans-serif;

.header{

.market{

.change{

.page{

.page.active{

}

.back{

}

.detail-card{
  background:#0c1b2b;

  border-radius:20px;
  padding:15px;
}

.detail-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.detail-symbol{
  font-size:24px;
  font-weight:bold;
}

.detail-name{
  color:#8195a9;
  margin-top:5px;
}

.live-box{
  text-align:left;
}

.live-label{
  color:#6f8498;
  font-size:11px;
}

.live-price{
  font-size:22px;
  font-weight:bold;
  margin-top:3px;
}

.live-status{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  font-size:10px;
  margin-top:4px;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#36dc91;
  box-shadow:0 0 10px #36dc91;
}

.chart-toolbar{
  display:flex;
  gap:6px;
  overflow:auto;
  margin:15px 0 8px;
}

.period{
  flex:0 0 auto;
  border:1px solid #28445f;
  background:#102238;
  color:#aebed0;
  padding:9px 12px;
  border-radius:10px;
  font-size:12px;
}

.period.active{
  background:#246bdb;
  color:#fff;
  border-color:#246bdb;
}

.chart-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#081725;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:8px;
}

.timer-label{
  color:#71869a;
  font-size:11px;
}

.timer{
  font-family:monospace;
  font-size:14px;
  font-weight:bold;
}

.source{
  color:#71869a;
  font-size:10px;
}

#chart{
  width:100%;
  height:390px;
  border-radius:15px;
  overflow:hidden;
  background:#07111c;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.stat{
  background:#0a1928;
  border-radius:12px;
  padding:12px;
}

.stat-label{
  color:#71869a;
  font-size:10px;
}

.stat-value{
  margin-top:5px;
  font-weight:bold;
}

.trade-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.trade{
  border:0;
  padding:14px;
  border-radius:13px;
  font-weight:bold;
  color:#fff;
}

.buy{
  background:#159b69;
}

.sell{
  background:#d64d61;
}

.empty{
  text-align:center;
  color:#778b9e;
  padding:30px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:67px;
  background:#091827f2;
  border-top:1px solid #1b334a;
  display:flex;
  justify-content:space-around;
  align-items:center;
  backdrop-filter:blur(15px);
}

.nav{
  color:#71869a;
  font-size:11px;
  text-align:center;
}

.nav.active{
  color:#fff;
}

.nav-icon{
  font-size:20px;
  margin-bottom:3px;
}

</style>
</head>

<body>

<div class="header">
  <div class="logo">💹 Digital Finance</div>
  <button class="refresh" onclick="refreshAll()">↻</button>
</div>

<div class="container">

  <div id="homePage" class="page active">

    <div class="gold-card">
      <div class="gold-title">
        🥇 طلای ۲۴ عیار

        در حال دریافت...

      </div>

    <input
      id="search"

      placeholder="🔎 جستجوی ارز..."

    >

    <div id="markets">

        در حال دریافت بازار...

    </div>

  <div id="detailPage" class="page">

    <button class="back" onclick="showHome()">
      ← بازگشت
    </button>

    <div class="detail-card">

        <div>
          <div class="detail-symbol" id="detailSymbol">
            BTC

          <div class="detail-name" id="detailName">

        </div>

        <div class="live-box">

          <div class="live-label">

          <div class="live-price"
               id="livePrice">

          </div>

          <div class="live-status">

                  id="liveDot"></span>

                data-period="24h"

        </button>

        <button class="period"

                onclick="changePeriod('30d')">

      <div class="chart-info">

          <div class="timer-label">

      <div class="stats">

        <div class="stat">

               id="statPrice">

        </div>

          <div class="stat-label">
            تغییر ۲۴ ساعت
          </div>

          <div class="stat-value"
               id="statChange">
            --
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            بالاترین ۲۴ ساعت
          </div>

               id="statHigh">
            --
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            پایین‌ترین ۲۴ ساعت

               id="statLow">

</div>


<div class="bottom">

       onclick="showHome()">

    <div class="nav-icon">

    بازار
  </div>

  <div class="nav">

    <div class="nav-icon">
      💼
    </div>

  </div>

  <div class="nav">

    <div class="nav-icon">
      📋
    </div>

  </div>

</div>


<script>

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){
  tg.ready();
  tg.expand();
}

const API_BASE = "";

let markets = [];

let selectedAsset = null;

let currentPeriod = "24h";

let chart = null;
let candleSeries = null;
let volumeSeries = null;

let liveTimer = null;

let tickerTimer = null;

const PERIOD_SECONDS = {
  "5m": 300,
  "1h": 3600,
  "4h": 14400,
  "24h": 86400,
  "7d": 604800,
  "30d": 86400
};


function formatPrice(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  if(n >= 1000){
    return n.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );
  }

  if(n >= 1){
    return n.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:6
      }
    );
  }

  return n.toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:10
    }
  );
}


function formatVolume(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "--";
  }

  if(n >= 1000000000){
    return (n / 1000000000).toFixed(2) + "B";
  }

  if(n >= 1000000){
    return (n / 1000000).toFixed(2) + "M";
  }

  if(n >= 1000){
    return (n / 1000).toFixed(2) + "K";
  }

  return n.toFixed(2);
}


async function loadGold(){

  try{

    const response =
      await fetch(
        API_BASE +
        "/api?action=gold"
      );

    const data =
      await response.json();

    if(
      data &&
      data.success
    ){

      const price =
        Number(
          data.price ??
          data.price_afn ??
          data.afn_per_gram ??
          data.metal_24k_afn_per_gram
        );

      if(Number.isFinite(price)){

        document.getElementById(
          "goldPrice"
        ).textContent =
          formatPrice(price) + " AFN";

      }

      document.getElementById(
        "goldMeta"
      ).textContent =
        "طلای ۲۴ عیار / گرم";

    }

  }catch(error){

    document.getElementById(
      "goldPrice"
    ).textContent =
      "خطا";

  }

}


async function loadMarkets(){

  try{

    const response =
      await fetch(
        API_BASE +
        "/api?action=markets"
      );

    const data =
      await response.json();

    if(
      data &&
      data.success &&
      Array.isArray(data.markets)
    ){

      markets =
        data.markets;

      renderMarkets(
        markets
      );

    }else{

      throw new Error(
        "Invalid markets response"
      );

    }

  }catch(error){

    console.error(error);

    document.getElementById(
      "markets"
    ).innerHTML = `
      <div class="empty">
        دریافت بازار ناموفق بود
      </div>
    `;

  }

}


function renderMarkets(list){

  const box =
    document.getElementById(
      "markets"
    );

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        ارزی پیدا نشد
      </div>
    `;

    return;
  }

  box.innerHTML =
    list.map(asset => {

      const symbol =
        String(
          asset.symbol || ""
        ).toUpperCase();

      const name =
        asset.name ||
        symbol;

      const price =
        Number(
          asset.price
        );

      const change =
        Number(
          asset.change24h ??
          asset.change_24h ??
          asset.price_change_percentage_24h ??
          0
        );

      const changeClass =
        change >= 0
          ? "green"
          : "red";

      const sign =
        change >= 0
          ? "+"
          : "";

      return `
        <div
          class="market"
          onclick="openAsset('${symbol}')"
        >

          <div class="market-left">

            <div class="coin-icon">
              ${symbol.slice(0,4)}
            </div>

            <div>

              <div class="symbol">
                ${symbol}
              </div>

              <div class="name">
                ${name}
              </div>

            </div>

          </div>

          <div class="price">

            <div>
              ${formatPrice(price)}
            </div>

            <div class="change ${changeClass}">
              ${sign}${change.toFixed(2)}%
            </div>

          </div>

        </div>
      `;

    }).join("");

}


function filterMarkets(){

  const query =
    document.getElementById(
      "search"
    ).value
    .trim()
    .toLowerCase();

  const filtered =
    markets.filter(asset => {

      const symbol =
        String(
          asset.symbol || ""
        ).toLowerCase();

      const name =
        String(
          asset.name || ""
        ).toLowerCase();

      return (
        symbol.includes(query) ||
        name.includes(query)
      );

    });

  renderMarkets(filtered);

}


function openAsset(symbol){

  const asset =
    markets.find(
      item =>
        String(
          item.symbol
        ).toUpperCase() === symbol
    );

  if(!asset){
    return;
  }

  selectedAsset =
    asset;

  document.getElementById(
    "detailSymbol"
  ).textContent =
    symbol;

  document.getElementById(
    "detailName"
  ).textContent =
    asset.name || symbol;

  document.getElementById(
    "homePage"
  ).classList.remove("active");

  document.getElementById(
    "detailPage"
  ).classList.add("active");

  currentPeriod =
    "24h";

  setActivePeriod();

  loadChart(
    symbol,
    currentPeriod
  );

  startLiveTicker(
    symbol
  );

  updateCandleTimer();

}


function showHome(){

  document.getElementById(
    "detailPage"
  ).classList.remove("active");

  document.getElementById(
    "homePage"
  ).classList.add("active");

  stopLiveTicker();

}


function setActivePeriod(){

  document
    .querySelectorAll(".period")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.period ===
        currentPeriod
      );

    });

}


function changePeriod(period){

  if(!selectedAsset){
    return;
  }

  currentPeriod =
    period;

  setActivePeriod();

  loadChart(
    selectedAsset.symbol,
    currentPeriod
  );

  updateCandleTimer();

}


function createChart(){

  const container =
    document.getElementById(
      "chart"
    );

  container.innerHTML = "";

  chart =
    LightweightCharts.createChart(
      container,
      {
        width:
          container.clientWidth,

        height:390,

        layout:{
          background:{
            color:"#07111c"
          },

          textColor:"#8195a8"
        },

        grid:{
          vertLines:{
            color:"#122335"
          },

          horzLines:{
            color:"#122335"
          }
        },

        rightPriceScale:{
          borderColor:"#20374c"
        },

        timeScale:{
          borderColor:"#20374c",

          timeVisible:true,

          secondsVisible:false
        },

        crosshair:{
          mode:
            LightweightCharts.CrosshairMode.Normal
        }
      }
    );

  candleSeries =
    chart.addCandlestickSeries({

      upColor:"#19c987",

      downColor:"#ef5b70",

      borderUpColor:"#19c987",

      borderDownColor:"#ef5b70",

      wickUpColor:"#19c987",

      wickDownColor:"#ef5b70",

      priceScaleId:"right"

    });

  volumeSeries =
    chart.addHistogramSeries({

      priceFormat:{
        type:"volume"
      },

      priceScaleId:"volume",

      scaleMargins:{
        top:0.80,
        bottom:0
      },

      lastValueVisible:false,

      priceLineVisible:false

    });

  chart
    .priceScale("volume")
    .applyOptions({
      scaleMargins:{
        top:0.80,
        bottom:0
      }
    });

  window.addEventListener(
    "resize",
    resizeChart
  );

}


function resizeChart(){

  if(!chart){
    return;
  }

  const container =
    document.getElementById(
      "chart"
    );

  chart.resize(
    container.clientWidth,
    390
  );

}


async function loadChart(
  symbol,
  interval
){

  if(
    String(symbol)
      .toUpperCase() ===
    "AFC"
  ){

    if(chart){
      chart.remove();
      chart = null;
    }

    document.getElementById(
      "chart"
    ).innerHTML = `
      <div class="empty">
        📊 نمودار AFC فعلاً موجود نیست<br>
        <small>
          پس از ایجاد بازار واقعی AFC،
          نمودار زنده فعال می‌شود.
        </small>
      </div>
    `;

    document.getElementById(
      "chartSource"
    ).textContent =
      "AFC";

    return;
  }

  try{

    if(chart){
      chart.remove();
      chart = null;
    }

    createChart();

    document.getElementById(
      "chartSource"
    ).textContent =
      "در حال دریافت...";

    const response =
      await fetch(
        API_BASE +
        "/api/candles?symbol=" +
        encodeURIComponent(symbol) +
        "&interval=" +
        encodeURIComponent(interval)
      );

    const data =
      await response.json();

    if(
      !data.success ||
      !Array.isArray(data.candles) ||
      !data.candles.length
    ){

      throw new Error(
        data.message ||
        "No candles"
      );

    }

    const candles =
      data.candles
        .filter(c =>
          Number.isFinite(
            Number(c.time)
          )
        )
        .map(c => ({
          time:Number(c.time),
          open:Number(c.open),
          high:Number(c.high),
          low:Number(c.low),
          close:Number(c.close)
        }));


    const volumes =
      data.candles
        .filter(c =>
          Number.isFinite(
            Number(c.time)
          )
        )
        .map(c => {

          const close =
            Number(c.close);

          const open =
            Number(c.open);

          return {
            time:Number(c.time),

            value:
              Number(c.volume || 0),

            color:
              close >= open
                ? "#19c98799"
                : "#ef5b7099"
          };

        });


    candleSeries.setData(
      candles
    );

    volumeSeries.setData(
      volumes
    );

    chart.timeScale().fitContent();

    document.getElementById(
      "chartSource"
    ).textContent =
      data.source || "Market";

  }catch(error){

    console.error(
      "Chart error:",
      error
    );

    if(chart){
      chart.remove();
      chart = null;
    }

    document.getElementById(
      "chart"
    ).innerHTML = `
      <div class="empty">
        ❌ نمودار دریافت نشد<br>
        <small>
          دوباره تلاش کنید
        </small>
      </div>
    `;

    document.getElementById(
      "chartSource"
    ).textContent =
      "Unavailable";

  }

}


async function updateLivePrice(
  symbol
){

  try{

    const response =
      await fetch(
        API_BASE +
        "/api/candles?action=ticker&symbol=" +
        encodeURIComponent(symbol)
      );

    const data =
      await response.json();

    if(
      !data.success
    ){
      throw new Error(
        data.message ||
        "Ticker unavailable"
      );
    }

    const price =
      Number(data.price);

    const change =
      Number(
        data.change24h || 0
      );

    document.getElementById(
      "livePrice"
    ).textContent =
      formatPrice(price);

    document.getElementById(
      "statPrice"
    ).textContent =
      formatPrice(price);

    const changeElement =
      document.getElementById(
        "statChange"
      );

    changeElement.textContent =
      (change >= 0 ? "+" : "") +
      change.toFixed(2) +
      "%";

    changeElement.className =
      "stat-value " +
      (change >= 0
        ? "green"
        : "red");

    document.getElementById(
      "statHigh"
    ).textContent =
      formatPrice(
        data.high24h
      );

    document.getElementById(
      "statLow"
    ).textContent =
      formatPrice(
        data.low24h
      );

    document.getElementById(
      "liveStatus"
    ).textContent =
      "Live • " +
      (data.source || "Market");

    document.getElementById(
      "liveDot"
    ).style.background =
      "#36dc91";

  }catch(error){

    document.getElementById(
      "liveStatus"
    ).textContent =
      "اتصال مجدد...";

    document.getElementById(
      "liveDot"
    ).style.background =
      "#f0a400";

  }

}


function startLiveTicker(
  symbol
){

  stopLiveTicker();

  updateLivePrice(
    symbol
  );

  tickerTimer =
    setInterval(
      () => {

        updateLivePrice(
          symbol
        );

      },
      3000
    );

}


function stopLiveTicker(){

  if(tickerTimer){

    clearInterval(
      tickerTimer
    );

    tickerTimer = null;

  }

}


function formatTimer(seconds){

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );

  const days =
    Math.floor(
      seconds / 86400
    );

  seconds %= 86400;

  const hours =
    Math.floor(
      seconds / 3600
    );

  seconds %= 3600;

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;


  const hh =
    String(hours)
      .padStart(2,"0");

  const mm =
    String(minutes)
      .padStart(2,"0");

  const ss =
    String(secs)
      .padStart(2,"0");


  if(days > 0){

    return (
      days +
      "d " +
      hh +
      ":" +
      mm +
      ":" +
      ss
    );

  }

  return (
    hh +
    ":" +
    mm +
    ":" +
    ss
  );

}


function updateCandleTimer(){

  const seconds =
    PERIOD_SECONDS[
      currentPeriod
    ] || 3600;

  const now =
    Math.floor(
      Date.now() / 1000
    );

  let remaining =
    seconds -
    (now % seconds);

  if(
    remaining === seconds
  ){
    remaining = 0;
  }

  document.getElementById(
    "candleTimer"
  ).textContent =
    formatTimer(
      remaining
    );

}
