<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>Digital Finance</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#07111f;
  color:#fff;
}

button,input{
  font-family:inherit;
}

.header{
  padding:22px 18px;
  background:linear-gradient(135deg,#0c1d32,#07111f);
  border-bottom:1px solid #20344d;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.subtitle{
  color:#8fa5bd;
  margin-top:6px;
  font-size:13px;
}

.container{
  padding:15px;
  padding-bottom:90px;
}

.card{
  background:linear-gradient(145deg,#10243a,#0b1a2c);
  border:1px solid #203b57;
  border-radius:18px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:14px;
}

.gold-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.gold-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.gold-icon{
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(145deg,#ffd84d,#b98200);
  color:#281d00;
  font-size:22px;
  font-weight:bold;
}

.gold-name{
  font-weight:bold;
  font-size:16px;
}

.small{
  color:#8fa5bd;
  font-size:12px;
  margin-top:5px;
}

.gold-price{
  color:#ffd84d;
  font-size:20px;
  font-weight:bold;
}

.search{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #29435f;
  outline:none;
  background:#071522;
  color:#fff;
  font-size:15px;
  margin-bottom:14px;
}

.market{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid #1d3248;
}

.market:last-child{
  border-bottom:none;
}

.coin-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.coin-icon{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#172d45;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  color:#dcecff;
  border:1px solid #31516e;
}

.coin-info{
  min-width:0;
}

.symbol{
  font-weight:bold;
  font-size:15px;
}

.name{
  color:#8198af;
  font-size:11px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:145px;
}

.coin-right{
  text-align:left;
}

.price{
  font-weight:bold;
  font-size:15px;
}

.afn{
  color:#7e95ad;
  font-size:11px;
  margin-top:4px;
}

.afc{
  border:1px solid #008f5a;
  background:linear-gradient(145deg,#073d2c,#08271f);
}

.afc .coin-icon{
  background:linear-gradient(145deg,#078b59,#023d29);
  border-color:#16b778;
  color:#fff;
}

.status{
  text-align:center;
  padding:15px;
  color:#8fa5bd;
}

.error{
  color:#ff7272;
  text-align:center;
  padding:15px;
}

.refresh{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#1769aa;
  color:white;
  font-size:15px;
  font-weight:bold;
  margin-top:8px;
}

.refresh:active{
  transform:scale(.98);
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#091726;
  border-top:1px solid #20364d;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
}

.nav{
  border:0;
  background:none;
  color:#7f96ae;
  font-size:12px;
}

.nav.active{
  color:#36a8ff;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.hidden{
  display:none;
}

.count{
  background:#193552;
  color:#9fc8ed;
  border-radius:20px;
  padding:4px 9px;
  font-size:11px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#71879d;
}

.loading{
  text-align:center;
  padding:25px;
  color:#8fa5bd;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Digital Finance</div>
  <div class="subtitle">بازار دارایی‌های دیجیتال و طلا</div>
</header>

<div class="container">

  <!-- HOME -->
  <section id="homePage">

    <div class="card">
      <div class="top-row">
        <div class="section-title" style="margin:0">
          قیمت طلا
        </div>
        <span class="count">24K</span>
      </div>

      <div class="gold-card">
        <div class="gold-left">
          <div class="gold-icon">Au</div>

          <div>
            <div class="gold-name">طلای ۲۴ عیار</div>
            <div class="small">هر گرم</div>
          </div>
        </div>

        <div>
          <div id="goldPrice" class="gold-price">
            در حال دریافت...
          </div>

          <div class="small" style="text-align:left">
            AFN
          </div>
        </div>
      </div>
    </div>


    <div class="card">

      <div class="top-row">
        <div class="section-title" style="margin:0">
          بازارها
        </div>

        <span id="marketCount" class="count">
          0
        </span>
      </div>

      <input
        id="search"
        class="search"
        type="text"
        placeholder="جستجوی ارز..."
        oninput="filterMarkets()"
      >

      <div id="markets">
        <div class="loading">
          در حال دریافت بازارها...
        </div>
      </div>

      <button
        class="refresh"
        onclick="loadAll()"
      >
        🔄 بروزرسانی
      </button>

    </div>

  </section>


  <!-- WALLET -->
  <section id="walletPage" class="hidden">

    <div class="card">
      <div class="section-title">
        کیف پول
      </div>

      <div class="empty">
        کیف پول دیجیتال شما
        <br><br>
        در مرحله بعد خرید، فروش و موجودی واقعی را اضافه می‌کنیم.
      </div>
    </div>

  </section>


  <!-- PROFILE -->
  <section id="profilePage" class="hidden">

    <div class="card">
      <div class="section-title">
        حساب کاربری
      </div>

      <div class="small">
        Digital Finance
      </div>

      <div style="margin-top:15px">
        وضعیت حساب:
        <b style="color:#36a8ff">
          فعال
        </b>
      </div>
    </div>

  </section>

</div>


<!-- BOTTOM NAV -->
<div class="bottom">

  <button
    class="nav active"
    onclick="showPage('homePage',this)"
  >
    <span class="nav-icon">📊</span>
    بازار
  </button>

  <button
    class="nav"
    onclick="showPage('walletPage',this)"
  >
    <span class="nav-icon">💰</span>
    کیف پول
  </button>

  <button
    class="nav"
    onclick="showPage('profilePage',this)"
  >
    <span class="nav-icon">👤</span>
    حساب
  </button>

</div>


<script>

const API_BASE =
  "https://finance-digital-eta.vercel.app";

let markets = [];


// =====================================
// API
// =====================================
async function api(url, options = {}) {

  const response =
    await fetch(API_BASE + url, options);

  const data =
    await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "API Error"
    );
  }

  return data;
}


// =====================================
// LOAD MARKETS
// =====================================
async function loadMarkets() {

  const box =
    document.getElementById("markets");

  try {

    box.innerHTML =
      '<div class="loading">در حال دریافت بازارها...</div>';

    /*
      مهم:
      Backend تو از action=markets استفاده می‌کند.
    */
    const data =
      await api("/api?action=markets");

    if (
      !data.success ||
      !Array.isArray(data.markets)
    ) {
      throw new Error("بازارها دریافت نشد");
    }

    markets =
      data.markets;

    document.getElementById(
      "marketCount"
    ).textContent =
      markets.length;

    renderMarkets(markets);

  } catch (error) {

    console.error(error);

    box.innerHTML = `
      <div class="error">
        ❌ دریافت بازارها ناموفق بود
        <br>
        <small>${error.message}</small>
      </div>
    `;
  }
}


// =====================================
// RENDER MARKETS
// =====================================
function renderMarkets(list) {

  const box =
    document.getElementById("markets");

  if (!list.length) {

    box.innerHTML = `
      <div class="empty">
        بازاری وجود ندارد
      </div>
    `;

    return;
  }

  box.innerHTML =
    list.map(asset => {

      const symbol =
        String(asset.symbol || "");

      const name =
        String(asset.name || "");

      const price =
        Number(asset.price || 0);

      const isAFC =
        symbol.toUpperCase() === "AFC";

      let formatted;

      if (price < 0.001) {

        formatted =
          price.toFixed(8);

      } else if (price < 1) {

        formatted =
          price.toFixed(4);

      } else {

        formatted =
          price.toLocaleString(
            "en-US",
            {
              maximumFractionDigits: 4
            }
          );
      }

      return `
        <div
          class="market ${isAFC ? "afc" : ""}"
          data-symbol="${symbol.toLowerCase()}"
          data-name="${name.toLowerCase()}"
        >

          <div class="coin-left">

            <div class="coin-icon">
              ${symbol.substring(0,6)}
            </div>

            <div class="coin-info">

              <div class="symbol">
                ${symbol}
              </div>

              <div class="name">
                ${name}
              </div>

            </div>

          </div>

          <div class="coin-right">

            <div class="price">
              ${formatted}
            </div>

            <div class="afn">
              USD
            </div>

          </div>

        </div>
      `;

    }).join("");
}


// =====================================
// SEARCH
// =====================================
function filterMarkets() {

  const value =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if (!value) {

    renderMarkets(markets);

    return;
  }

  const filtered =
    markets.filter(asset => {

      const symbol =
        String(asset.symbol || "")
          .toLowerCase();

      const name =
        String(asset.name || "")
          .toLowerCase();

      return (
        symbol.includes(value) ||
        name.includes(value)
      );
    });

  renderMarkets(filtered);
}


// =====================================
// GOLD
// =====================================
async function loadGold() {

  const element =
    document.getElementById("goldPrice");

  try {

    const data =
      await api("/api?action=gold");

    if (
      !data.success
    ) {
      throw new Error(
        "قیمت طلا دریافت نشد"
      );
    }

    const price =
      Number(data.price || 0);

    element.textContent =
      price.toLocaleString(
        "fa-IR"
      );

  } catch (error) {

    console.error(error);

    element.textContent =
      "خطا";
  }
}


// =====================================
// LOAD EVERYTHING
// =====================================
async function loadAll() {

  await Promise.all([
    loadMarkets(),
    loadGold()
  ]);

}


// =====================================
// NAVIGATION
// =====================================
function showPage(
  pageId,
  button
) {

  document
    .querySelectorAll(
      "#homePage,#walletPage,#profilePage"
    )
    .forEach(page => {

      page.classList.add(
        "hidden"
      );

    });

  document
    .getElementById(pageId)
    .classList.remove(
      "hidden"
    );

  document
    .querySelectorAll(".nav")
    .forEach(nav => {

      nav.classList.remove(
        "active"
      );

    });

  button.classList.add(
    "active"
  );
}


// =====================================
// START
// =====================================
document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadAll();

  }
);

</script>

</body>
</html>
