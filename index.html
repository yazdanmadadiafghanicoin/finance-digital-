<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
  name="theme-color"
  content="#07111f"
>

<title>Digital Finance</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #07111f;
  color: #ffffff;
  font-family:
    Arial,
    Tahoma,
    sans-serif;
}

body {
  min-height: 100vh;
  padding-bottom: 90px;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 16px;
}


/* HEADER */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #1ddc88,
      #0a8f61
    );

  font-size: 23px;
  font-weight: bold;
}

.logo-title {
  font-size: 20px;
  font-weight: bold;
}

.logo-sub {
  font-size: 11px;
  color: #8190a5;
  margin-top: 3px;
}

.refresh-btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 13px;

  background: #122238;
  color: white;

  font-size: 20px;
}


/* GOLD */

.gold-card {

  position: relative;

  padding: 20px;

  border-radius: 22px;

  margin-bottom: 18px;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #332b10,
      #17130a
    );

  border:
    1px solid
    rgba(255,210,60,0.25);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,0.25);
}

.gold-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.gold-title {
  font-size: 15px;
  font-weight: bold;
}

.gold-badge {
  padding: 5px 9px;
  border-radius: 8px;

  background:
    rgba(255,200,50,0.12);

  color: #ffd34d;

  font-size: 11px;
}

.gold-price {
  font-size: 29px;
  font-weight: bold;
  margin-top: 15px;
}

.gold-unit {
  color: #9b9170;
  font-size: 12px;
  margin-top: 4px;
}

.gold-source {
  margin-top: 12px;
  color: #7f8b9d;
  font-size: 10px;
}


/* SECTION */

.section-head {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin:
    22px 2px 12px;
}

.section-title {
  font-size: 17px;
  font-weight: bold;
}

.live {
  display: flex;
  align-items: center;
  gap: 5px;

  color: #20db85;
  font-size: 11px;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;

  background: #20db85;

  box-shadow:
    0 0 10px
    rgba(32,219,133,0.8);
}


/* SEARCH */

.search-box {
  width: 100%;

  border: 1px solid
    rgba(255,255,255,0.08);

  outline: none;

  background: #0d1b2d;

  color: white;

  border-radius: 14px;

  padding:
    14px 16px;

  margin-bottom: 12px;

  font-size: 14px;
}

.search-box::placeholder {
  color: #64748b;
}


/* TOP COINS */

.top-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

  margin-bottom: 18px;
}

.top-card {

  padding: 13px;

  border-radius: 16px;

  background:
    #0d1b2d;

  border:
    1px solid
    rgba(255,255,255,0.06);
}

.top-symbol {
  font-size: 13px;
  font-weight: bold;
}

.top-price {
  margin-top: 7px;

  font-size: 15px;
  font-weight: bold;
}

.top-change {
  margin-top: 5px;

  font-size: 11px;
}


/* MARKET */

.market-card {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  padding: 15px;

  margin-bottom: 9px;

  border-radius: 17px;

  background:
    #0d1b2d;

  border:
    1px solid
    rgba(255,255,255,0.06);

  transition:
    transform 0.15s;
}

.market-card:active {
  transform: scale(0.985);
}

.coin-left {
  display: flex;

  align-items:
    center;

  gap: 12px;

  min-width: 0;
}

.coin-icon {

  width: 43px;
  height: 43px;

  flex-shrink: 0;

  border-radius: 50%;

  display: flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    linear-gradient(
      135deg,
      #172d46,
      #0b1625
    );

  font-size: 13px;
  font-weight: bold;
}

.coin-symbol {
  font-size: 15px;
  font-weight: bold;
}

.coin-name {

  margin-top: 3px;

  font-size: 10px;

  color: #718096;

  max-width: 130px;

  white-space:
    nowrap;

  overflow:
    hidden;

  text-overflow:
    ellipsis;
}

.coin-right {
  text-align: left;
}

.coin-price {
  font-size: 14px;
  font-weight: bold;
}

.coin-change {

  margin-top: 5px;

  font-size: 11px;

  font-weight: bold;
}

.up {
  color: #20db85;
}

.down {
  color: #ff5368;
}


/* AFC */

.afc-card {

  background:
    linear-gradient(
      135deg,
      rgba(0,150,90,0.17),
      rgba(0,0,0,0.15)
    );

  border:
    1px solid
    rgba(0,220,130,0.25);
}


/* LOADING */

.loading {

  text-align: center;

  padding: 35px 10px;

  color: #687991;

  font-size: 13px;
}

.error {

  text-align: center;

  padding: 20px;

  border-radius: 14px;

  background:
    rgba(255,70,90,0.08);

  border:
    1px solid
    rgba(255,70,90,0.15);

  color: #ff7180;

  font-size: 12px;
}


/* WALLET */

.wallet-card {

  padding: 20px;

  border-radius: 20px;

  background:
    linear-gradient(
      135deg,
      #10243a,
      #0b1728
    );

  border:
    1px solid
    rgba(255,255,255,0.07);

  margin-bottom: 12px;
}

.wallet-label {
  color: #8190a5;
  font-size: 12px;
}

.wallet-value {
  font-size: 30px;
  font-weight: bold;
  margin-top: 8px;
}

.wallet-usdt {
  color: #20db85;
  font-size: 12px;
  margin-top: 5px;
}

.balance-row {

  display: flex;

  justify-content:
    space-between;

  padding: 14px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,0.06);
}

.balance-row:last-child {
  border-bottom: 0;
}

.balance-symbol {
  font-weight: bold;
}

.balance-amount {
  color: #aeb8c7;
}


/* PROFILE */

.profile-card {

  padding: 20px;

  border-radius: 20px;

  background: #0d1b2d;

  text-align: center;
}

.profile-icon {

  width: 70px;
  height: 70px;

  border-radius: 50%;

  margin: auto;

  display: flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    linear-gradient(
      135deg,
      #1c6bff,
      #623cff
    );

  font-size: 28px;

  font-weight: bold;
}

.profile-name {

  margin-top: 12px;

  font-size: 18px;

  font-weight: bold;
}

.profile-id {

  margin-top: 5px;

  color: #687991;

  font-size: 11px;
}


/* NAV */

.bottom-nav {

  position: fixed;

  left: 50%;

  bottom: 10px;

  transform:
    translateX(-50%);

  width:
    calc(100% - 20px);

  max-width: 680px;

  padding: 8px;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 5px;

  border-radius: 20px;

  background:
    rgba(11,25,42,0.96);

  backdrop-filter:
    blur(15px);

  border:
    1px solid
    rgba(255,255,255,0.08);

  z-index: 100;
}

.nav-btn {

  border: 0;

  background:
    transparent;

  color: #64748b;

  padding: 10px 5px;

  border-radius: 14px;

  font-size: 11px;
}

.nav-btn span {
  display: block;
  font-size: 20px;
  margin-bottom: 4px;
}

.nav-btn.active {

  background:
    rgba(32,219,133,0.10);

  color: #20db85;
}


/* MODAL */

.modal {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,0.72);

  display: none;

  align-items:
    flex-end;

  z-index: 200;
}

.modal.show {
  display: flex;
}

.modal-box {

  width: 100%;

  max-width: 700px;

  margin: auto;

  background: #0c1a2b;

  border-radius:
    25px 25px 0 0;

  padding: 22px;

  border-top:
    1px solid
    rgba(255,255,255,0.08);
}

.modal-title {

  font-size: 18px;

  font-weight: bold;

  margin-bottom: 18px;
}

.close-btn {

  width: 100%;

  padding: 13px;

  border: 0;

  border-radius: 13px;

  background: #17283e;

  color: white;

  margin-top: 12px;
}

.trade-input {

  width: 100%;

  padding: 14px;

  background: #07111f;

  color: white;

  border: 1px solid
    rgba(255,255,255,0.08);

  border-radius: 13px;

  outline: none;

  margin-bottom: 10px;
}

.trade-buttons {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;
}

.buy-btn,
.sell-btn {

  border: 0;

  padding: 14px;

  border-radius: 13px;

  color: white;

  font-weight: bold;
}

.buy-btn {
  background: #128d59;
}

.sell-btn {
  background: #c83f55;
}

.hidden {
  display: none !important;
}

</style>

</head>


<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        DF
      </div>

      <div>

        <div class="logo-title">
          Digital Finance
        </div>

        <div class="logo-sub">
          بازار جهانی دارایی‌ها
        </div>

      </div>

    </div>

    <button
      class="refresh-btn"
      onclick="loadAll()"
    >
      ↻
    </button>

  </div>


  <!-- GOLD -->

  <div class="gold-card">

    <div class="gold-top">

      <div class="gold-title">
        🥇 طلای جهانی
      </div>

      <div
        class="gold-badge"
        id="goldPurity"
      >
        24K
      </div>

    </div>

    <div
      class="gold-price"
      id="goldPrice"
    >
      در حال دریافت...
    </div>

    <div class="gold-unit">
      AFN / گرم
    </div>

    <div
      class="gold-source"
      id="goldSource"
    >
      دریافت قیمت جهانی...
    </div>

  </div>


  <!-- MARKET -->

  <div id="marketPage">

    <div class="section-head">

      <div class="section-title">
        بازار
      </div>

      <div class="live">
        <div class="live-dot"></div>
        زنده
      </div>

    </div>


    <input
      id="search"
      class="search-box"
      placeholder="جستجوی ارز..."
      oninput="filterMarkets()"
    >


    <div
      id="topGrid"
      class="top-grid"
    ></div>


    <div
      id="markets"
    >
      <div class="loading">
        در حال دریافت قیمت‌ها...
      </div>
    </div>

  </div>


  <!-- WALLET -->

  <div
    id="walletPage"
    class="hidden"
  >

    <div class="section-head">

      <div class="section-title">
        کیف پول
      </div>

    </div>

    <div class="wallet-card">

      <div class="wallet-label">
        ارزش تقریبی دارایی
      </div>

      <div
        class="wallet-value"
        id="walletTotal"
      >
        $0.00
      </div>

      <div class="wallet-usdt">
        موجودی Digital Finance
      </div>

    </div>

    <div
      class="wallet-card"
      id="balances"
    >
      <div class="loading">
        در حال دریافت موجودی...
      </div>
    </div>

  </div>


  <!-- PROFILE -->

  <div
    id="profilePage"
    class="hidden"
  >

    <div class="section-head">

      <div class="section-title">
        حساب کاربری
      </div>

    </div>

    <div class="profile-card">

      <div class="profile-icon">
        DF
      </div>

      <div
        class="profile-name"
        id="profileName"
      >
        Digital Finance
      </div>

      <div
        class="profile-id"
        id="profileId"
      >
        حساب آزمایشی
      </div>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button
    class="nav-btn active"
    id="navMarket"
    onclick="showPage('market')"
  >
    <span>📈</span>
    بازار
  </button>

  <button
    class="nav-btn"
    id="navWallet"
    onclick="showPage('wallet')"
  >
    <span>💰</span>
    کیف پول
  </button>

  <button
    class="nav-btn"
    id="navProfile"
    onclick="showPage('profile')"
  >
    <span>👤</span>
    حساب
  </button>

</div>


<!-- TRADE MODAL -->

<div
  class="modal"
  id="tradeModal"
>

  <div class="modal-box">

    <div
      class="modal-title"
      id="tradeTitle"
    >
      خرید و فروش
    </div>

    <input
      id="tradeAmount"
      class="trade-input"
      type="number"
      step="any"
      min="0"
      placeholder="مقدار ارز"
    >

    <div class="trade-buttons">

      <button
        class="buy-btn"
        onclick="executeTrade('buy')"
      >
        خرید
      </button>

      <button
        class="sell-btn"
        onclick="executeTrade('sell')"
      >
        فروش
      </button>

    </div>

    <button
      class="close-btn"
      onclick="closeTrade()"
    >
      بستن
    </button>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const API_BASE = "/api";

let markets = [];

let selectedAsset = null;

let telegramId = "123456789";

let tg = null;


/* =========================================================
   TELEGRAM
   ========================================================= */

try {

  if (
    window.Telegram &&
    window.Telegram.WebApp
  ) {

    tg =
      window.Telegram.WebApp;

    tg.ready();

    tg.expand();

    if (
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user &&
      tg.initDataUnsafe.user.id
    ) {

      telegramId =
        String(
          tg.initDataUnsafe.user.id
        );

      const user =
        tg.initDataUnsafe.user;

      document.getElementById(
        "profileName"
      ).textContent =
        user.first_name ||
        user.username ||
        "Digital Finance";

      document.getElementById(
        "profileId"
      ).textContent =
        "Telegram ID: " +
        telegramId;
    }

  }

} catch (e) {

  console.log(
    "Telegram WebApp unavailable"
  );
}


/* =========================================================
   API
   ========================================================= */

async function api(action, options = {}) {

  const url =
    API_BASE +
    "?action=" +
    encodeURIComponent(action);

  const response =
    await fetch(url, {
      ...options,
      headers: {
        "Content-Type":
          "application/json",
        ...(options.headers || {})
      }
    });

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error ||
      "API Error"
    );
  }

  return data;
}


/* =========================================================
   FORMAT
   ========================================================= */

function formatPrice(value) {

  const price =
    Number(value || 0);

  if (!Number.isFinite(price)) {
    return "0";
  }

  if (price < 0.000001) {
    return price.toFixed(10);
  }

  if (price < 0.001) {
    return price.toFixed(8);
  }

  if (price < 1) {
    return price.toFixed(6);
  }

  if (price < 1000) {
    return price.toLocaleString(
      "en-US",
      {
        maximumFractionDigits: 4
      }
    );
  }

  return price.toLocaleString(
    "en-US",
    {
      maximumFractionDigits: 2
    }
  );
}


function formatMoney(value) {

  return Number(
    value || 0
  ).toLocaleString(
    "en-US",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );
}


/* =========================================================
   GOLD
   ========================================================= */

async function loadGold() {

  try {

    const data =
      await api("gold");

    const price =
      Number(data.price || 0);

    if (
      data.success &&
      price > 0
    ) {

      document.getElementById(
        "goldPrice"
      ).textContent =
        formatMoney(price) +
        " AFN";

      document.getElementById(
        "goldPurity"
      ).textContent =
        data.purity ||
        "24K";

      document.getElementById(
        "goldSource"
      ).textContent =
        "قیمت جهانی زنده • " +
        (
          data.source ||
          "XAUS"
        );

    } else {

      document.getElementById(
        "goldPrice"
      ).textContent =
        "قیمت در دسترس نیست";

      document.getElementById(
        "goldSource"
      ).textContent =
        "اتصال به سرویس طلا برقرار نشد";
    }

  } catch (error) {

    console.error(error);

    document.getElementById(
      "goldPrice"
    ).textContent =
      "خطا";

    document.getElementById(
      "goldSource"
    ).textContent =
      "قیمت طلا فعلاً در دسترس نیست";
  }
}


/* =========================================================
   MARKETS
   ========================================================= */

async function loadMarkets() {

  const container =
    document.getElementById(
      "markets"
    );

  container.innerHTML =
    `<div class="loading">
      در حال دریافت قیمت‌های جهانی...
    </div>`;

  try {

    const data =
      await api("markets");

    if (
      !data.success ||
      !Array.isArray(data.markets)
    ) {

      throw new Error(
        "Markets data unavailable"
      );
    }

    markets =
      data.markets;

    renderTop();

    renderMarkets(markets);

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="error">
        دریافت بازار ناموفق بود.<br>
        لطفاً دوباره تلاش کنید.
      </div>`;
  }
}


/* =========================================================
   TOP
   ========================================================= */

function renderTop() {

  const grid =
    document.getElementById(
      "topGrid"
    );

  const top =
    markets
      .filter(
        x =>
          x.symbol !== "AFC" &&
          Number(x.price) > 0
      )
      .slice(0, 6);

  grid.innerHTML = "";

  top.forEach(asset => {

    const change =
      Number(
        asset.change_24h || 0
      );

    const positive =
      change >= 0;

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "top-card";

    card.innerHTML = `

      <div class="top-symbol">
        ${asset.symbol}
      </div>

      <div class="top-price">
        $${formatPrice(asset.price)}
      </div>

      <div class="top-change ${
        positive ? "up" : "down"
      }">

        ${positive ? "▲" : "▼"}
        ${positive ? "+" : ""}
        ${change.toFixed(2)}%

      </div>
    `;

    grid.appendChild(card);
  });
}


/* =========================================================
   MARKET RENDER
   ========================================================= */

function renderMarkets(list) {

  const container =
    document.getElementById(
      "markets"
    );

  container.innerHTML = "";

  if (!list.length) {

    container.innerHTML =
      `<div class="loading">
        ارزی پیدا نشد.
      </div>`;

    return;
  }

  list.forEach(asset => {

    const price =
      Number(asset.price || 0);

    const change =
      Number(
        asset.change_24h || 0
      );

    const positive =
      change >= 0;

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "market-card " +
      (
        asset.symbol === "AFC"
          ? "afc-card"
          : ""
      );

    card.onclick = () => {

      openTrade(asset);
    };

    const icon =
      asset.symbol === "AFC"
        ? "؋"
        : asset.symbol
            .substring(0, 2);

    card.innerHTML = `

      <div class="coin-left">

        <div class="coin-icon">
          ${icon}
        </div>

        <div>

          <div class="coin-symbol">
            ${asset.symbol}
          </div>

          <div class="coin-name">
            ${asset.name}
          </div>

        </div>

      </div>

      <div class="coin-right">

        <div class="coin-price">
          $${formatPrice(price)}
        </div>

        <div class="coin-change ${
          positive
            ? "up"
            : "down"
        }">

          ${positive ? "▲" : "▼"}
          ${positive ? "+" : ""}
          ${change.toFixed(2)}%

        </div>

      </div>
    `;

    container.appendChild(
      card
    );
  });
}


/* =========================================================
   SEARCH
   ========================================================= */

function filterMarkets() {

  const value =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toLowerCase();

  if (!value) {

    renderMarkets(markets);

    return;
  }

  const filtered =
    markets.filter(asset => {

      return (
        String(
          asset.symbol || ""
        )
          .toLowerCase()
          .includes(value)
        ||
        String(
          asset.name || ""
        )
          .toLowerCase()
          .includes(value)
      );
    });

  renderMarkets(filtered);
}


/* =========================================================
   WALLET
   ========================================================= */

async function loadWallet() {

  const box =
    document.getElementById(
      "balances"
    );

  box.innerHTML =
    `<div class="loading">
      در حال دریافت موجودی...
    </div>`;

  try {

    const data =
      await api(
        "balances&telegram_id=" +
        encodeURIComponent(
          telegramId
        )
      );

    const balances =
      data.balances || [];

    let total = 0;

    balances.forEach(item => {

      const amount =
        Number(
          item.amount || 0
        );

      const price =
        Number(
          item.price || 0
        );

      total +=
        amount * price;
    });

    document.getElementById(
      "walletTotal"
    ).textContent =
      "$" +
      formatMoney(total);

    if (!balances.length) {

      box.innerHTML =
        `<div class="loading">
          هنوز موجودی ندارید.
        </div>`;

      return;
    }

    box.innerHTML = "";

    balances.forEach(item => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "balance-row";

      row.innerHTML = `

        <div>

          <div class="balance-symbol">
            ${item.symbol}
          </div>

          <div class="coin-name">
            ${item.name}
          </div>

        </div>

        <div class="balance-amount">
          ${Number(
            item.amount || 0
          ).toLocaleString(
            "en-US",
            {
              maximumFractionDigits: 8
            }
          )}
        </div>
      `;

      box.appendChild(row);
    });

  } catch (error) {

    console.error(error);

    box.innerHTML =
      `<div class="error">
        دریافت موجودی ناموفق بود.
      </div>`;
  }
}


/* =========================================================
   TRADE
   ========================================================= */

function openTrade(asset) {

  selectedAsset =
    asset;

  document.getElementById(
    "tradeTitle"
  ).textContent =
    asset.symbol +
    " • $" +
    formatPrice(
      asset.price
    );

  document.getElementById(
    "tradeAmount"
  ).value = "";

  document.getElementById(
    "tradeModal"
  ).classList.add(
    "show"
  );
}


function closeTrade() {

  document.getElementById(
    "tradeModal"
  ).classList.remove(
    "show"
  );

  selectedAsset =
    null;
}


async function executeTrade(side) {

  if (!selectedAsset) {
    return;
  }

  const amount =
    Number(
      document.getElementById(
        "tradeAmount"
      ).value
    );

  if (
    !Number.isFinite(amount) ||
    amount <= 0
  ) {

    alert(
      "مقدار معتبر وارد کنید."
    );

    return;
  }

  try {

    const result =
      await api(
        side,
        {
          method: "POST",

          body: JSON.stringify({
            telegram_id:
              telegramId,

            symbol:
              selectedAsset.symbol,

            amount
          })
        }
      );

    if (result.success) {

      alert(
        (
          side === "buy"
            ? "خرید"
            : "فروش"
        ) +
        " با موفقیت ثبت شد."
      );

      closeTrade();

      loadWallet();
    }

  } catch (error) {

    alert(
      error.message ||
      "عملیات انجام نشد."
    );
  }
}


/* =========================================================
   PAGES
   ========================================================= */

function showPage(page) {

  document.getElementById(
    "marketPage"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "walletPage"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "profilePage"
  ).classList.add(
    "hidden"
  );

  document
    .getElementById(
      "navMarket"
    )
    .classList.remove(
      "active"
    );

  document
    .getElementById(
      "navWallet"
    )
    .classList.remove(
      "active"
    );

  document
    .getElementById(
      "navProfile"
    )
    .classList.remove(
      "active"
    );


  if (page === "market") {

    document
      .getElementById(
        "marketPage"
      )
      .classList.remove(
        "hidden"
      );

    document
      .getElementById(
        "navMarket"
      )
      .classList.add(
        "active"
      );
  }


  if (page === "wallet") {

    document
      .getElementById(
        "walletPage"
      )
      .classList.remove(
        "hidden"
      );

    document
      .getElementById(
        "navWallet"
      )
      .classList.add(
        "active"
      );

    loadWallet();
  }


  if (page === "profile") {

    document
      .getElementById(
        "profilePage"
      )
      .classList.remove(
        "hidden"
      );

    document
      .getElementById(
        "navProfile"
      )
      .classList.add(
        "active"
      );
  }
}


/* =========================================================
   LOAD ALL
   ========================================================= */

async function loadAll() {

  await Promise.all([
    loadMarkets(),
    loadGold(),
    loadWallet()
  ]);
}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

loadAll();

setInterval(
  () => {

    loadMarkets();

    loadGold();

  },
  60000
);


/* =========================================================
   CLOSE MODAL
   ========================================================= */

document
  .getElementById(
    "tradeModal"
  )
  .addEventListener(
    "click",
    function(e) {

      if (
        e.target === this
      ) {

        closeTrade();
      }

    }
  );

</script>
