<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0e11">
<title>Digital Finance</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:#0b0e11;color:#fff;
  font-family:Arial,Tahoma,sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:85px}

header{
  position:sticky;top:0;z-index:20;
  background:#0b0e11ee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #252a30;
  padding:14px 16px;
}
.header-row{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:800}
.logo span{color:#f0b90b}
.status{font-size:12px;color:#929aa5;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#f0b90b}
.dot.ok{background:#16c784}
.dot.error{background:#f6465d}

.balance{
  margin:15px;padding:19px;border-radius:16px;
  background:linear-gradient(145deg,#171b20,#0e1115);
  border:1px solid #292e34;
}
.balance-label{color:#8b949e;font-size:13px}
.balance-value{font-size:30px;font-weight:800;margin-top:7px;direction:ltr;text-align:right}
.balance-sub{font-size:12px;color:#737d88;margin-top:6px}

.actions{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin:15px;
}
.action{
  border:0;border-radius:10px;padding:14px;font-weight:800;
}
.buy{background:#16c784;color:#06150f}
.sell{background:#f6465d;color:white}

.search{margin:15px}
.search input{
  width:100%;padding:13px 15px;
  border-radius:10px;border:1px solid #2b3138;
  background:#15191e;color:#fff;outline:none;
}
.search input:focus{border-color:#f0b90b}

.filters{
  display:flex;gap:8px;overflow:auto;padding:0 15px 12px;
}
.filters button{
  white-space:nowrap;padding:8px 14px;
  border-radius:20px;border:1px solid #30363d;
  background:#15191e;color:#aeb5bd;
}
.filters button.active{
  background:#f0b90b;color:#111;border-color:#f0b90b;font-weight:bold;
}

.market-card{
  margin:15px;border:1px solid #272d33;
  border-radius:15px;overflow:hidden;background:#101419;
}
.market-head{
  padding:14px;border-bottom:1px solid #272d33;
  display:flex;justify-content:space-between;
}
.market-count{font-size:12px;color:#7d8791}

.market{
  display:grid;
  grid-template-columns:1.45fr 1fr .65fr;
  align-items:center;gap:8px;
  padding:14px;border-bottom:1px solid #20252b;
}
.market:last-child{border-bottom:0}

.symbol{font-size:15px;font-weight:800}
.name{
  font-size:11px;color:#77818c;
  margin-top:4px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.price{text-align:left;direction:ltr;font-weight:700}
.change{text-align:left;direction:ltr;font-size:11px;color:#16c784}
.gold{color:#f0b90b}

.trade-small{
  border:1px solid #353c44;
  background:#181d23;color:#fff;
  border-radius:7px;padding:7px 9px;font-size:11px;
}
.trade-small:hover{border-color:#f0b90b}

.gold-row{
  background:linear-gradient(90deg,#17150d,#111419);
  border-right:3px solid #f0b90b;
}

.loading{text-align:center;padding:40px;color:#8a949f}
.spinner{
  width:28px;height:28px;margin:0 auto 12px;
  border:3px solid #30363d;border-top-color:#f0b90b;
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.error{
  display:none;margin:15px;padding:15px;
  background:#251317;border:1px solid #63252f;
  border-radius:10px;color:#ff9aa8;
}
.retry{
  margin-top:10px;border:0;border-radius:7px;
  background:#f0b90b;color:#111;padding:9px 15px;font-weight:bold;
}

.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  max-width:1100px;margin:auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:#11151a;border-top:1px solid #292f35;
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
}
.bottom button{
  border:0;background:none;color:#737d88;
  font-size:11px;padding:5px;
}
.bottom button.active{color:#f0b90b}
.icon{display:block;font-size:19px;margin-bottom:3px}

.modal{
  display:none;position:fixed;inset:0;z-index:100;
  background:#000b;align-items:flex-end;justify-content:center;
}
.modal.show{display:flex}
.modal-box{
  width:100%;max-width:600px;
  max-height:90vh;overflow:auto;
  background:#15191e;border:1px solid #30363d;
  border-radius:20px 20px 0 0;padding:20px;
}
.modal-title{
  display:flex;justify-content:space-between;
  align-items:center;font-size:19px;font-weight:bold;
  margin-bottom:18px;
}
.close{
  width:34px;height:34px;border:0;border-radius:50%;
  background:#252b31;color:#fff;font-size:20px;
}
.label{font-size:12px;color:#89939e;margin:13px 0 6px}
.input,.select{
  width:100%;padding:13px;border-radius:9px;
  background:#0d1014;color:#fff;
  border:1px solid #30363d;outline:none;
}
.info{
  background:#0d1115;border:1px solid #282e34;
  border-radius:9px;padding:12px;
  margin-top:12px;color:#aab2ba;font-size:12px;
}
.modal-actions{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-top:18px;
}
.modal-actions button{
  border:0;border-radius:9px;padding:13px;font-weight:bold;
}
.empty{text-align:center;padding:30px;color:#747e89}
.positive{color:#16c784}
.negative{color:#f6465d}

@media(min-width:700px){
  .modal{align-items:center}
  .modal-box{border-radius:18px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header-row">
    <div class="logo">Digital <span>Finance</span></div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>
</header>

<section class="balance">
  <div class="balance-label">Total Wallet Balance</div>
  <div class="balance-value">
    <span id="walletBalance">10,000.00</span> USDT
  </div>
  <div class="balance-sub">Demo Trading Account</div>
</section>

<div class="actions">
  <button class="action buy" onclick="openTrade('buy')">خرید</button>
  <button class="action sell" onclick="openTrade('sell')">فروش</button>
</div>

<div class="search">
  <input id="searchInput" type="search"
    placeholder="جستجوی ارز، طلا یا نماد...">
</div>

<div class="filters">
  <button class="active" data-filter="all">همه</button>
  <button data-filter="crypto">Crypto</button>
  <button data-filter="stable">Stablecoins</button>
  <button data-filter="gold">Gold</button>
</div>

<div id="errorBox" class="error">
  <div id="errorText"></div>
  <button class="retry" onclick="loadMarkets()">تلاش دوباره</button>
</div>

<section class="market-card">

  <div class="market-head">
    <strong>Markets</strong>
    <span id="marketCount" class="market-count">0 assets</span>
  </div>

  <div id="marketList">
    <div class="loading">
      <div class="spinner"></div>
      در حال دریافت بازارها...
    </div>
  </div>

</section>

</div>

<nav class="bottom">

  <button class="active" onclick="home(this)">
    <span class="icon">🏠</span>
    Markets
  </button>

  <button onclick="openWallet()">
    <span class="icon">💰</span>
    Wallet
  </button>

  <button onclick="openPortfolio()">
    <span class="icon">📊</span>
    Portfolio
  </button>

  <button onclick="openHistory()">
    <span class="icon">🧾</span>
    History
  </button>

</nav>


<!-- TRADE -->

<div id="tradeModal" class="modal">
<div class="modal-box">

  <div class="modal-title">
    <span id="tradeTitle">Buy</span>
    <button class="close" onclick="closeModal('tradeModal')">×</button>
  </div>

  <div class="label">Market</div>

  <select id="tradeMarket" class="select"></select>

  <div class="label">Amount USDT</div>

  <input id="tradeAmount"
    class="input"
    type="number"
    min="0"
    step="0.01"
    placeholder="100">

  <div id="tradeInfo" class="info">
    مقدار معامله را وارد کنید.
  </div>

  <div class="modal-actions">
    <button id="buyBtn" class="buy"
      onclick="executeTrade('buy')">خرید</button>

    <button id="sellBtn" class="sell"
      onclick="executeTrade('sell')">فروش</button>
  </div>

</div>
</div>


<!-- WALLET -->

<div id="walletModal" class="modal">
<div class="modal-box">

  <div class="modal-title">
    <span>Wallet</span>
    <button class="close" onclick="closeModal('walletModal')">×</button>
  </div>

  <div class="info">
    USDT Balance
    <br><br>
    <strong id="walletModalBalance">10,000.00 USDT</strong>
  </div>

  <div class="info">
    حساب Demo با موجودی اولیه 10,000 USDT
  </div>

</div>
</div>


<!-- PORTFOLIO -->

<div id="portfolioModal" class="modal">
<div class="modal-box">

  <div class="modal-title">
    <span>Portfolio</span>
    <button class="close" onclick="closeModal('portfolioModal')">×</button>
  </div>

  <div id="portfolioContent"></div>

</div>
</div>


<!-- HISTORY -->

<div id="historyModal" class="modal">
<div class="modal-box">

  <div class="modal-title">
    <span>History</span>
    <button class="close" onclick="closeModal('historyModal')">×</button>
  </div>

  <div id="historyContent"></div>

</div>
</div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_BASE = window.location.origin;

const GOLD_PRICE_USD = 4145;

const GOLD_SYMBOL = "GOLD24";

const STARTING_BALANCE = 10000;

let markets = [];
let filteredMarkets = [];

let walletBalance = STARTING_BALANCE;

let portfolio = {};
let history = [];

let filter = "all";


/* =========================================================
   GOLD
========================================================= */

function createGoldMarket(){

  return {
    id:"gold24",
    symbol:"GOLD24",
    name:"Gold 24K — 1 Troy Ounce",
    price:GOLD_PRICE_USD,
    active:true,
    isGold:true
  };

}


/*
  طلا همیشه وجود دارد.
  اگر Backend طلا نداشت، خودکار اضافه می‌شود.
  اگر Backend طلا داشت، قیمت صفحه روی 4145 تنظیم می‌شود.
*/

function addOrFixGold(){

  const existing = markets.find(m =>
    m.symbol === "GOLD24" ||
    m.symbol === "XAU"
  );

  if(existing){

    existing.symbol = "GOLD24";
    existing.name = "Gold 24K — 1 Troy Ounce";
    existing.price = GOLD_PRICE_USD;
    existing.isGold = true;

  }else{

    markets.unshift(createGoldMarket());

  }

  /* همیشه طلا اول باشد */

  const gold = markets.find(
    m => m.symbol === "GOLD24"
  );

  markets = [
    gold,
    ...markets.filter(
      m => m !== gold
    )
  ];

}


/* =========================================================
   STATUS
========================================================= */

function status(type,text){

  const dot =
    document.getElementById("statusDot");

  const label =
    document.getElementById("statusText");

  dot.className = "dot";

  if(type === "ok")
    dot.classList.add("ok");

  if(type === "error")
    dot.classList.add("error");

  label.textContent = text;
}


/* =========================================================
   LOAD MARKETS
========================================================= */

async function loadMarkets(){

  status("","Connecting...");

  hideError();

  document.getElementById("marketList").innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      در حال دریافت بازارها...
    </div>
  `;

  try{

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        ()=>controller.abort(),
        12000
      );

    const response =
      await fetch(
        API_BASE +
        "/api/markets?_" +
        Date.now(),
        {
          method:"GET",
          headers:{
            "Accept":"application/json"
          },
          cache:"no-store",
          signal:controller.signal
        }
      );

    clearTimeout(timeout);

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data =
      await response.json();

    if(data.success !== true){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }

    if(!Array.isArray(data.markets)){

      throw new Error(
        "markets در پاسخ سرور وجود ندارد"
      );

    }

    markets =
      data.markets.map(
        (item,index)=>({

          id:item.id ?? index + 1,

          symbol:String(
            item.symbol || ""
          ).toUpperCase(),

          name:String(
            item.name ||
            item.symbol ||
            "Unknown"
          ),

          price:Number(item.price) || 0,

          active:item.active !== false

        })
      );

    /*
      GOLD24 = $4,145
    */

    addOrFixGold();

    status("ok","Connected");

    renderMarkets();

    fillTradeMarkets();

  }catch(error){

    console.error(error);

    status("error","Connection Error");

    showError(
      error.name === "AbortError"
      ? "اتصال به سرور بیشتر از ۱۲ ثانیه طول کشید."
      : error.message
    );

    document.getElementById(
      "marketList"
    ).innerHTML = `
      <div class="empty">
        بازارها دریافت نشدند.
        <br><br>
        تلاش دوباره را بزنید.
      </div>
    `;

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderMarkets(){

  const query =
    document.getElementById(
      "searchInput"
    ).value.trim().toLowerCase();

  filteredMarkets =
    markets.filter(m=>{

      const searchOK =
        !query ||
        m.symbol.toLowerCase().includes(query) ||
        m.name.toLowerCase().includes(query);

      let filterOK = true;

      if(filter === "gold"){

        filterOK =
          m.symbol === "GOLD24" ||
          m.isGold;

      }

      if(filter === "stable"){

        filterOK =
          m.symbol.includes("USDT") ||
          m.symbol.includes("USDC");

      }

      if(filter === "crypto"){

        filterOK =
          !m.symbol.includes("USDT") &&
          !m.symbol.includes("USDC") &&
          !m.isGold;

      }

      return searchOK && filterOK;

    });

  document.getElementById(
    "marketCount"
  ).textContent =
    filteredMarkets.length +
    " / " +
    markets.length +
    " assets";

  if(!filteredMarkets.length){

    document.getElementById(
      "marketList"
    ).innerHTML =
      `<div class="empty">نتیجه‌ای پیدا نشد.</div>`;

    return;
  }

  document.getElementById(
    "marketList"
  ).innerHTML =
    filteredMarkets.map(m=>{

      const isGold =
        m.symbol === "GOLD24" ||
        m.isGold;

      return `

      <div class="market ${isGold ? "gold-row" : ""}">

        <div>

          <div class="symbol ${isGold ? "gold" : ""}">
            ${escapeHTML(m.symbol)}
          </div>

          <div class="name">
            ${escapeHTML(m.name)}
          </div>

        </div>

        <div>

          <div class="price">

            ${
              isGold
              ? "$" + formatPrice(m.price)
              : formatPrice(m.price)
            }

          </div>

          <div class="change">
            +0.00%
          </div>

        </div>

        <div style="text-align:left">

          <button
            class="trade-small"
            onclick="openTradeFor('${String(m.id)}')">
            Trade
          </button>

        </div>

      </div>

      `;

    }).join("");

}


/* =========================================================
   PRICE
========================================================= */

function formatPrice(n){

  n = Number(n);

  if(!Number.isFinite(n))
    return "0.00";

  return n.toLocaleString(
    "en-US",
    {
      minimumFractionDigits:
        n >= 1 ? 2 : 4,
      maximumFractionDigits:
        n >= 1 ? 2 : 10
    }
  );

}


/* =========================================================
   TRADE
========================================================= */

function fillTradeMarkets(){

  const select =
    document.getElementById(
      "tradeMarket"
    );

  select.innerHTML =
    markets.map(m=>{

      return `
        <option value="${escapeHTML(String(m.id))}">
          ${escapeHTML(m.symbol)}
          —
          ${
            m.symbol === "GOLD24"
            ? "$" + formatPrice(m.price)
            : formatPrice(m.price)
          }
        </option>
      `;

    }).join("");

}


function openTrade(side){

  document.getElementById(
    "tradeTitle"
  ).textContent =
    side === "buy"
    ? "Buy"
    : "Sell";

  document.getElementById(
    "buyBtn"
  ).style.display =
    side === "buy"
    ? "block"
    : "none";

  document.getElementById(
    "sellBtn"
  ).style.display =
    side === "sell"
    ? "block"
    : "none";

  document.getElementById(
    "tradeModal"
  ).classList.add("show");

  updateTradeInfo();

}


function openTradeFor(id){

  document.getElementById(
    "tradeMarket"
  ).value = String(id);

  openTrade("buy");

}


function updateTradeInfo(){

  const id =
    document.getElementById(
      "tradeMarket"
    ).value;

  const amount =
    Number(
      document.getElementById(
        "tradeAmount"
      ).value
    ) || 0;

  const market =
    markets.find(
      m => String(m.id) === String(id)
    );

  if(!market) return;

  const quantity =
    amount / market.price;

  document.getElementById(
    "tradeInfo"
  ).innerHTML = `

    ${escapeHTML(market.symbol)}

    <br>

    قیمت:
    <strong>
      ${
        market.symbol === "GOLD24"
        ? "$" + formatPrice(market.price)
        : formatPrice(market.price)
      }
    </strong>

    <br>

    مقدار:
    <strong>
      ${quantity.toFixed(8)}
    </strong>

  `;

}


function executeTrade(side){

  const id =
    document.getElementById(
      "tradeMarket"
    ).value;

  const amount =
    Number(
      document.getElementById(
        "tradeAmount"
      ).value
    );

  const market =
    markets.find(
      m => String(m.id) === String(id)
    );

  if(!market){

    alert("بازار انتخاب نشده است.");
    return;

  }

  if(!amount || amount <= 0){

    alert("مقدار معتبر وارد کنید.");
    return;

  }

  const quantity =
    amount / market.price;

  const symbol =
    market.symbol;

  if(side === "buy"){

    if(amount > walletBalance){

      alert(
        "موجودی کافی نیست."
      );

      return;

    }

    walletBalance -= amount;

    if(!portfolio[symbol]){

      portfolio[symbol] = {
        symbol,
        name:market.name,
        quantity:0,
        invested:0
      };

    }

    portfolio[symbol].quantity += quantity;

    portfolio[symbol].invested += amount;

  }else{

    if(
      !portfolio[symbol] ||
      portfolio[symbol].quantity < quantity
    ){

      alert(
        "مقدار این ارز برای فروش کافی نیست."
      );

      return;

    }

    walletBalance += amount;

    portfolio[symbol].quantity -= quantity;

    portfolio[symbol].invested -= amount;

    if(
      portfolio[symbol].quantity <= 0.00000001
    ){

      delete portfolio[symbol];

    }

  }

  history.unshift({

    side,
    symbol,
    quantity,
    amount,
    price:market.price,
    time:new Date().toLocaleString()

  });

  save();

  updateBalance();

  closeModal("tradeModal");

  document.getElementById(
    "tradeAmount"
  ).value = "";

  alert(
    side === "buy"
    ? "خرید با موفقیت ثبت شد."
    : "فروش با موفقیت ثبت شد."
  );

}


/* =========================================================
   WALLET
========================================================= */

function updateBalance(){

  document.getElementById(
    "walletBalance"
  ).textContent =
    formatPrice(walletBalance);

  document.getElementById(
    "walletModalBalance"
  ).textContent =
    formatPrice(walletBalance) +
    " USDT";

}


function openWallet(){

  updateBalance();

  document.getElementById(
    "walletModal"
  ).classList.add("show");

}


/* =========================================================
   PORTFOLIO
========================================================= */

function openPortfolio(){

  const items =
    Object.values(portfolio)
      .filter(x=>x.quantity > 0);

  const box =
    document.getElementById(
      "portfolioContent"
    );

  if(!items.length){

    box.innerHTML =
      `<div class="empty">
        Portfolio خالی است.
      </div>`;

  }else{

    box.innerHTML =
      items.map(x=>`

        <div class="info">

          <strong>
            ${escapeHTML(x.symbol)}
          </strong>

          <br><br>

          Quantity:
          ${x.quantity.toFixed(8)}

          <br>

          Invested:
          ${formatPrice(x.invested)}
          USDT

        </div>

      `).join("");

  }

  document.getElementById(
    "portfolioModal"
  ).classList.add("show");

}


/* =========================================================
   HISTORY
========================================================= */

function openHistory(){

  const box =
    document.getElementById(
      "historyContent"
    );

  if(!history.length){

    box.innerHTML =
      `<div class="empty">
        هنوز معامله‌ای انجام نشده است.
      </div>`;

  }else{

    box.innerHTML =
      history.map(x=>`

        <div class="info">

          <strong class="${
            x.side === "buy"
            ? "positive"
            : "negative"
          }">

            ${x.side.toUpperCase()}
            ${escapeHTML(x.symbol)}

          </strong>

          <br><br>

          Quantity:
          ${x.quantity.toFixed(8)}

          <br>

          Amount:
          ${formatPrice(x.amount)}
          USDT

          <br>

          Price:
          ${formatPrice(x.price)}

          <br><br>

          <small>
            ${escapeHTML(x.time)}
          </small>

        </div>

      `).join("");

  }

  document.getElementById(
    "historyModal"
  ).classList.add("show");

}


/* =========================================================
   STORAGE
========================================================= */

function save(){

  localStorage.setItem(
    "digital_finance_data",
    JSON.stringify({
      walletBalance,
      portfolio,
      history
    })
  );

}


function load(){

  try{

    const raw =
      localStorage.getItem(
        "digital_finance_data"
      );

    if(!raw) return;

    const data =
      JSON.parse(raw);

    if(
      typeof data.walletBalance ===
      "number"
    ){

      walletBalance =
        data.walletBalance;

    }

    if(data.portfolio)
      portfolio = data.portfolio;

    if(Array.isArray(data.history))
      history = data.history;

  }catch(e){

    console.log(e);

  }

  updateBalance();

}


/* =========================================================
   FILTER / SEARCH
========================================================= */

document.querySelectorAll(
  ".filters button"
).forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{

      document.querySelectorAll(
        ".filters button"
      ).forEach(x=>
        x.classList.remove("active")
      );

      btn.classList.add("active");

      filter =
        btn.dataset.filter;

      renderMarkets();

    }
  );

});


document.getElementById(
  "searchInput"
).addEventListener(
  "input",
  renderMarkets
);


document.getElementById(
  "tradeMarket"
).addEventListener(
  "change",
  updateTradeInfo
);


document.getElementById(
  "tradeAmount"
).addEventListener(
  "input",
  updateTradeInfo
);


/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

  document.getElementById(
    id
  ).classList.remove("show");

}


document.querySelectorAll(
  ".modal"
).forEach(modal=>{

  modal.addEventListener(
    "click",
    e=>{

      if(e.target === modal)
        modal.classList.remove("show");

    }
  );

});


function home(button){

  document.querySelectorAll(
    ".bottom button"
  ).forEach(x=>
    x.classList.remove("active")
  );

  button.classList.add("active");

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  document.getElementById(
    "errorBox"
  ).style.display = "block";

  document.getElementById(
    "errorText"
  ).textContent =
    "خطا: " + message;

}


function hideError(){

  document.getElementById(
    "errorBox"
  ).style.display = "none";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   TELEGRAM
========================================================= */

function initTelegram(){

  try{

    if(
      window.Telegram &&
      Telegram.WebApp
    ){

      Telegram.WebApp.ready();
      Telegram.WebApp.expand();

    }

  }catch(e){}

}


/* =========================================================
   START
========================================================= */

async function start(){

  initTelegram();

  load();

  await loadMarkets();

}


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
  ()=>{
    if(
      document.visibilityState ===
      "visible"
    ){
      loadMarkets();
    }
  },
  30000
);


if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    start
  );

}else{

  start();

}

</script>
